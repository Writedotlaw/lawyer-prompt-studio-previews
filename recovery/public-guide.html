function renderLab(id){const l=LABS.find(l=>l.id===id);if(!l)return render404();return `<div class="page activity-page"><header class="page-heading"><span class="eyebrow">${resourceType(id)} · About ${esc(l.time)}</span><h1>${l.title}</h1><p>${l.desc}</p></header><div class="activity-links"><a class="text-btn" href="#/read/${l.chapter}">${icon('book')} Read the related chapter</a><a class="text-btn" href="${resourceIsExercise(l)?'#/labs':'#/templates'}">${resourceIsExercise(l)?'All exercises':'All templates & worksheets'} ${icon('arrow')}</a><span class="save-status">${storageOK?'Entries save in this browser':'Storage unavailable: download before leaving'}</span></div>${resourceIntro(id)}<div data-widget="${id}"></div>${resourceEnd(id)}${footer()}</div>`;}

function renderPrompts(){return `<div class="page"><header class="page-heading"><span class="eyebrow"><a href="#/templates">Templates & worksheets</a> / Prompt templates</span><h1>Prompts to adapt</h1><p>Choose a request that fits your task. Read the instructions, replace every bracketed placeholder, and supply the permitted materials in an approved AI tool. Copying a prompt here does not run AI.</p>${helpButton('prompts','How to use a prompt template')}</header><div class="section-context"><p>A saved template is a bookmark. To prepare and keep your own version, use the <a class="inline-link" href="#/lab/promptbuilder">prompt builder</a>.</p></div><div class="library-controls"><div class="chips" aria-label="Filter prompts">${['All','Learn','Analyze','Write','Verify','Build','Saved'].map(c=>`<button class="tab ${promptCategory===c?'active':''}" data-action="prompt-filter" data-category="${c}" aria-pressed="${promptCategory===c}">${({Learn:'Learning',Analyze:'Analysis',Write:'Writing',Verify:'Checking',Build:'Planning & testing'})[c]||c}</button>`).join('')}</div><label class="filter-input">${icon('search')}<span class="sr-only">Search prompt templates</span><input type="search" id="prompt-search" placeholder="Find a prompt…" value="${esc(promptQuery)}"></label></div><div class="prompt-grid" id="prompt-list">${renderPromptList()}</div>${footer()}</div>`;}

function renderPromptList(){const matches=PROMPTS.filter(p=>(promptCategory==='All'||p.category===promptCategory||(promptCategory==='Saved'&&state.favorites.includes(p.id)))&&(`${p.title} ${p.use} ${p.text}`.toLowerCase().includes(promptQuery.toLowerCase())));return matches.length?matches.map(p=>`<section class="prompt-card" id="prompt-${p.id}"><div class="between"><span class="pill">${({Learn:'Learning',Analyze:'Analysis',Write:'Writing',Verify:'Checking',Build:'Planning & testing'})[p.category]}</span><button class="icon-btn ${state.favorites.includes(p.id)?'active':''}" data-action="favorite" data-id="${p.id}" aria-label="${state.favorites.includes(p.id)?'Remove saved template:':'Save template:'} ${esc(p.title)}" aria-pressed="${state.favorites.includes(p.id)}" data-tip="Save a reference to this template in My saved work. This does not create an editable copy.">${icon('bookmark')}</button></div><h2>${p.title}</h2><p class="prompt-use">${p.use}</p><details class="disclosure prompt-instructions"><summary>Read the instructions to copy</summary><div class="inside"><pre>${esc(p.text)}</pre></div></details><div class="actions"><button class="button compact" data-action="copy-prompt" data-id="${p.id}">${icon('copy')} Copy prompt</button></div><div class="source-note">${p.source}</div></section>`).join(''):`<div class="empty" style="grid-column:1/-1">${icon('search')}<h2>${promptCategory==='Saved'?'No saved templates yet':'No matching templates'}</h2><p>${promptCategory==='Saved'?'Select All and use a template’s bookmark button to save it here. Your own drafted prompts appear separately in My saved work.':'Try a different word or category.'}</p></div>`;}

function renderGlossary(){return `<div class="page"><header class="page-heading"><span class="eyebrow">Reference</span><h1>Glossary</h1><p>Look up a term when you encounter it in the reading. Each explanation links to a chapter where the idea is used; you do not need to memorize the glossary before beginning.</p>${helpButton('glossary','How to use the glossary')}</header><div class="library-controls"><label class="filter-input">${icon('search')}<span class="sr-only">Filter glossary</span><input type="search" id="glossary-search" placeholder="Find a term or an idea…" value="${esc(glossaryQuery)}"></label><span class="small muted" id="glossary-count">${GLOSSARY.length} terms</span></div><div class="glossary-grid" id="glossary-list">${renderGlossaryList()}</div>${footer()}</div>`;}

function renderGlossaryList(){const a=GLOSSARY.filter(([t,d])=>`${t} ${d}`.toLowerCase().includes(glossaryQuery.toLowerCase())).sort((a,b)=>a[0].localeCompare(b[0]));const count=document.getElementById('glossary-count');if(count)count.textContent=`${a.length} terms`;return a.length?a.map(([t,d,c])=>`<section class="glossary-item"><h3>${t}</h3><p>${d}</p><a href="#/read/${c}">Read the related chapter ${icon('arrow')}</a></section>`).join(''):`<div class="empty" style="grid-column:1/-1">No matching terms. Try “sources,” “judgment,” or “agent.”</div>`;}
function renderSources(){return `<div class="page"><header class="page-heading"><span class="eyebrow">Reference / Sources & editorial notes</span><h1>Sources and editorial notes</h1><p>This student edition brings together Professor Joe Regalia’s four supplied teaching documents and the graphing guide developed for this project.</p></header><div class="source-grid">${SOURCES.map((s,i)=>`<section class="source-card" id="source-${s.id}"><span class="eyebrow">${i<4?'Teaching material':'Companion guide'} ${num(i+1)} ${s.pages?`/ ${s.pages} pages`:''}</span><h3>${s.title}</h3><p>${s.description}</p><div class="source-file">${esc(s.file)}</div></section>`).join('')}</div><div class="reference-prose"><h2>How the pieces fit together</h2><p>The four chapter subjects—Foundations, Systems, Building, and Leadership—come from the Fall guide. The six-part collaboration framework and ten prompting principles come from the Skills & AI-isms slides. The five-stage responsible-use operating system is a separate framework. The twelve-point semester checklist is a practical review aid. The chapters preserve those distinctions rather than merging them into a new numbered formula.</p><p>Page references use the page or slide number in the supplied PDF. The sixteen chapters are an editorial synthesis, not a verbatim or complete reproduction of every source page. The original PDFs are not distributed through this website. This revision edits the explanations and interface throughout, while retaining the original chapter identifiers and saved-response fields. The intentionally weak exercise passages remain identified as source material.</p><h2>What was adapted for interaction</h2><p>The workflow simulation, task-card displays, worksheet responses, prompt forms, chapter questions, discussions, sample revisions, and saved worksheets are learning adaptations. They use the sources’ concepts, but should not be mistaken for a supplied answer key or legal determination. A prepared explanation appears when you select an option; no AI model is generating a response.</p><p>The Stonebridge, Falcon Medical, and fee-table exercises preserve the source passages and identify new commentary separately. The AI-isms exercise uses the four source categories to inspect writing, not to determine authorship. Recognizing a phrase does not establish who wrote it.</p><h2>Scope and verification</h2><p>This is an educational guide, not jurisdiction-specific legal advice, an authorization to use AI, or a current product-policy directory. Follow the actual course, assignment, workplace, client, court, and jurisdictional requirements. The original sources’ product rosters, market statistics, broad capability claims, and dated research descriptions are not independently updated here.</p><p>The source deck’s slide 66 contains a specific data-retention rule and enforcement example without supporting authority in the supplied packet. Those assertions are not adopted as legal guidance. This edition uses the source-grounded Stonebridge and Falcon passages for concrete revision work instead. Reflection questions are identified as adapted selections rather than the full question bank.</p><p>The preceding graphing guide explained that the linked X article was not fully accessible. This wiki presents that practical workflow explanation; it does not claim to reproduce or independently verify the full article.</p><h2>Your notes and browser storage</h2><p>Your typed notes, responses, prompts, and reading progress stay in this browser profile. The app has no AI calls, note-upload feature, instructor submission, account system, or analytics code. Ordinary hosting requests may still be processed by the hosting provider. Exported notebook and backup files contain your saved work.</p><p>Use fictional or non-sensitive material. Browser storage is not an approved client workspace. Other users of the same browser profile may see it; clearing browser data may remove it; another device will not have it unless you import a backup. Export important work and keep the file in an appropriate location.</p><h2>Reading preferences</h2><div class="actions"><button class="button compact" data-action="theme">${icon('moon')} Toggle theme</button><button class="button compact" data-action="font">Aa &nbsp; Change reading size</button><button class="button compact" data-action="motion" aria-pressed="${state.motion}">${icon('eye')} ${state.motion?'Allow motion':'Reduce motion'}</button></div><p class="small muted" style="margin-top:16px">The guide also respects your system’s reduced-motion preference. Reading progress and chapter answers are for your own reference, not an instructor assessment.</p></div>${footer()}</div>`;}
function fieldLabel(key){const fixed={'pause-baseline':'Assessment saved before feedback','prompt-saved':'Your saved prompt version','prompt-saved-assignment':'Your saved prompt version','fee-choice':'Comparison version selected','pause-decision':'Decision about the feedback','pause-feedback':'Feedback received','pause-reason':'Reason for the decision','fee-reflection':'Which sentence you would use, and why','fee-open':'Fee-table comparison opened','priorities-open':'Fact-priority discussion opened','stonebridge-open':'Stonebridge comparison opened','falcon-open':'Falcon comparison opened'};if(fixed[key])return fixed[key];if(FIELD_LABELS[key])return FIELD_LABELS[key];if(key.startsWith('note-'))return 'Chapter note: '+(CHAPTERS.find(c=>c.id===key.slice(5))?.nav||key.slice(5));if(key.startsWith('order-'))return 'Agent work order: '+(ORDER_FIELDS.find(f=>`order-${f[0]}`===key)?.[1]||key);if(key.startsWith('reflection-')){const m=key.match(/^reflection-(\d+)-(\d+)-(start|mid|end)$/);if(m&&REFLECTIONS[+m[1]]?.questions[+m[2]])return `${({start:'Beginning',mid:'Midpoint',end:'End'})[m[3]]}: ${REFLECTIONS[+m[1]].questions[+m[2]]}`;}if(key.startsWith('playbook-'))return PLAYBOOK_FIELDS.find(f=>`playbook-${f[0]}`===key)?.[1]||key;return key.replace(/-/g,' ').replace(/^./,c=>c.toUpperCase());}
function savedTextEntries(){return Object.entries(state.fields).filter(([k,v])=>typeof v==='string'&&v.trim()&&!SELECT_CHOICES[k]&&k!=='fee-choice');}
function savedSelections(){return Object.entries(state.fields).filter(([k,v])=>(typeof v==='boolean'&&!k.endsWith('-open'))||(typeof v==='string'&&v.trim()&&(SELECT_CHOICES[k]||k==='fee-choice')));}
function selectionText(key,v){if(typeof v==='boolean')return v?'Checked':'Not checked';if(key==='fee-choice')return FEE_OPTIONS[Number(v)]?.label||String(v);return SELECT_CHOICES[key]?.[v]||String(v);}
function renderSavedSelections(){const selections=savedSelections(),answers=Object.entries(state.quiz);if(!selections.length&&!answers.length)return '';return `<section class="notebook-section"><h2>Your selections and chapter answers</h2><p>These record what you selected, not an independent assessment of the work. Return to an activity to see the explanation or change an answer.</p>${selections.length?`<details class="saved-group"><summary><span>Worksheet choices and checkboxes</span><span class="small">${selections.length} recorded</span></summary><div class="saved-group-body"><dl class="saved-selections">${selections.map(([k,v])=>`<div><dt><a href="${fieldRoute(k)}">${esc(fieldLabel(k))}</a></dt><dd>${esc(selectionText(k,v))}</dd></div>`).join('')}</dl></div></details>`:''}${answers.length?`<details class="saved-group"><summary><span>Chapter questions</span><span class="small">${answers.length} answered</span></summary><div class="saved-group-body">${answers.map(([id,pick])=>{const c=CHAPTERS.find(c=>c.id===id);return `<section class="saved-quiz"><h3><a href="#/read/${id}?section=quiz">${c.nav}</a></h3><p>${c.quiz.q}</p><p><strong>Your selection:</strong> ${esc(c.quiz.a[pick])}</p></section>`;}).join('')}</div></details>`:''}</section>`;}

function fieldRoute(key){if(key.startsWith('note-'))return '#/read/'+key.slice(5);if(key==='exercise-role')return '#/read/lawyer';const rules=[['order-','workorder'],['prompt-','promptbuilder'],['priority-','priorities'],['priorities-','priorities'],['pause-','pause'],['graph-','graph'],['fee-','fee'],['stonebridge-','stonebridge'],['falcon-','falcon'],['aiisms-','aiisms'],['process-','process'],['shipping-','shipping'],['reflection-','reflection'],['playbook-','playbook'],['preflight-','preflight']];return '#/lab/'+(rules.find(([p])=>key.startsWith(p))?.[1]||'playbook');}
function renderNotebook(){const notes=savedTextEntries(),groups=new Map();notes.forEach(([k,v])=>{const route=fieldRoute(k);let title=route.startsWith('#/read/')?'Chapter notes':LABS.find(l=>route==='#/lab/'+l.id)?.title||'Other saved entries';if(!groups.has(title))groups.set(title,[]);groups.get(title).push([k,v,route]);});const fieldCount=Object.keys(state.fields).length;
 return `<div class="page"><header class="page-heading"><span class="eyebrow">Your entries and bookmarks</span><h1>My saved work</h1><p>This page collects what you have written elsewhere in the guide. Notes and responses save in this browser; they are not submitted to your instructor or sent to an AI model.</p>${helpButton('notebook','How saving and backups work')}</header><section class="notebook-toolbar"><div class="between"><h2>Keep a copy of your work</h2><span class="save-status">${storageOK?'Browser storage is available':'Storage unavailable'}</span></div><p>Download readable notes to review outside the guide. Download a backup to restore your entries and progress in another browser. Different devices and site addresses do not share saved work automatically.</p><div class="data-actions"><button class="button primary compact" data-action="export-md">${icon('download')} Download readable notes</button><button class="button compact" data-action="export-json">${icon('download')} Download a backup</button><button class="button compact" data-action="import">${icon('upload')} Restore a backup</button><input type="file" id="import-file" accept=".json,application/json" hidden></div><p class="small muted">Readable notes are a text file you can open outside the guide. A backup is a separate file used to restore saved work here. Use non-sensitive material and store downloaded files appropriately.</p></section>${!fieldCount&&!state.favorites.length&&!state.bookmarks.length&&!Object.keys(state.quiz).length&&!state.done.length?`<section class="empty notebook-empty"><h2>You have not saved any work yet.</h2><p>Write a chapter note or try an activity. Your responses will appear here automatically, so you do not need to fill in this page first.</p><a class="button compact" href="#/labs">Choose an exercise ${icon('arrow')}</a></section>`:''}<section class="notebook-section"><div class="section-heading"><div><h2>Your notes and responses</h2><p>Open a group to read or edit an entry. The linked activity shows the question and your other answers together.</p></div></div>${groups.size?[...groups].map(([title,entries])=>`<details class="saved-group"><summary><span>${esc(title)}</span><span class="small">${entries.length} ${entries.length===1?'entry':'entries'}</span></summary><div class="saved-group-body">${entries.map(([k,v,route])=>`<details class="disclosure"><summary>${esc(fieldLabel(k))}</summary><div class="inside"><label class="field" for="saved-${esc(k)}"><span>Edit your response</span><textarea id="saved-${esc(k)}" data-save="${esc(k)}" aria-label="Edit ${esc(fieldLabel(k))}">${esc(v)}</textarea></label><a class="text-btn" href="${route}">Return to the question ${icon('arrow')}</a></div></details>`).join('')}</div></details>`).join(''):`<p class="muted">Written responses will appear here when you add them to a chapter or activity.</p>`}</section>${renderSavedSelections()}<section class="notebook-section saved-reference-grid"><div><h2>Bookmarked chapters</h2>${state.bookmarks.length?state.bookmarks.map(id=>{const c=CHAPTERS.find(c=>c.id===id);return `<a class="saved-link" href="#/read/${id}">${c.nav} ${icon('arrow')}</a>`;}).join(''):'<p>Use “Bookmark chapter” at the end of a reading to keep a link here.</p>'}</div><div><h2>Saved prompt templates</h2>${state.favorites.length?state.favorites.map(id=>{const p=PROMPTS.find(p=>p.id===id);return `<details class="disclosure"><summary>${p.title}</summary><div class="inside"><pre>${esc(p.text)}</pre><button class="text-btn" data-action="copy-prompt" data-id="${id}">${icon('copy')} Copy prompt</button></div></details>`;}).join(''):'<p>Use the bookmark on a prompt template to save it. These references are separate from a prompt you write in the builder.</p><a class="text-btn" href="#/prompts">Browse templates '+icon('arrow')+'</a>'}</div></section><section class="notebook-section"><h2>Develop your personal playbook</h2><p>The playbook is a worksheet for drawing lessons from these entries. It does not automatically summarize your notes, and you do not have to complete it before using other resources.</p><a href="#/lab/playbook" class="button compact">Open the playbook worksheet ${icon('arrow')}</a></section><details class="disclosure"><summary>Reading progress · ${state.done.length} of ${CHAPTERS.length} chapters marked as read</summary><div class="inside"><p>These marks are for your own reference, not a measure of mastery.</p><div class="progress-checks">${CHAPTERS.map((c,i)=>`<div class="progress-row"><label><input type="checkbox" data-read="${c.id}" ${state.done.includes(c.id)?'checked':''}><span>${num(i+1)} &nbsp; ${c.nav}</span></label><a href="#/read/${c.id}" class="icon-btn" aria-label="Read ${esc(c.nav)}">${icon('arrow')}</a></div>`).join('')}</div></div></details><details class="disclosure manage-storage"><summary>Manage stored data</summary><div class="inside"><p>Clearing saved work removes entries, bookmarks, and progress from this browser. Download a backup first when you need to keep them. This does not affect any backup files you have already downloaded.</p><button class="button compact danger" data-action="reset-data">Clear this browser’s saved work</button></div></details>${footer()}</div>`;}

function renderHelp(){return `<div class="page help-page"><header class="page-heading"><span class="eyebrow">Getting around and keeping your work</span><h1>How to use this guide</h1><p>Start with a chapter when you are learning a concept. Use an exercise to practice on supplied material, or a template or worksheet to prepare your own work.</p></header><div class="help-page-layout"><nav class="help-contents" aria-label="Help topics"><a href="#/help?topic=areas">What each area is for</a><a href="#/help?topic=first">A first visit</a><a href="#/help?topic=activities">Exercises, templates, and worksheets</a><a href="#/help?topic=saving">Saving and backups</a><a href="#/help?topic=controls">Reading controls</a><a href="#/help?topic=questions">Common questions</a></nav><div class="reference-prose"><section id="help-areas"><h2>What each area is for</h2><p><strong>Chapters</strong> explain the concepts. They follow the four subjects in the Fall guide: Foundations, Systems, Building, and Leadership. Those subjects organize the reading; they are not different kinds of exercise.</p><p><strong>Exercises</strong> provide a passage or fictional scenario. You make an initial attempt and then examine prepared discussion. An exercise can appear within a chapter and on its own page, but it is the same resource and uses the same saved response.</p><p><strong>Templates & worksheets</strong> help with a task you bring. A prompt template supplies starting instructions. The prompt builder assembles your instructions from a form. Other worksheets help you plan or review an assignment; they do not perform it for you.</p><p><strong>My saved work</strong> collects your notes, responses, bookmarked chapters, and saved prompt templates. The personal playbook is a worksheet for drawing lessons from those entries. Neither is a place where work is automatically submitted to your instructor.</p></section><section id="help-first"><h2>A first visit</h2><p>Begin with the first chapter and follow its links when you reach an activity. Read the instructions before typing, and make your own attempt before opening the comparison. At the end of a chapter, keep a note about something you would use or question.</p><p>You do not need to complete the entire resource collection before continuing. Your instructor’s assignment directions take priority over suggested times or routes in this guide.</p><a href="#/read/lawyer" class="button compact">Open the first chapter ${icon('arrow')}</a></section><section id="help-activities"><h2>What happens on an activity page?</h2><p>The introduction explains what to bring, what to do first, and what you should have when you finish. The Help button provides more detailed instructions for that resource. Important directions also appear on the page, so you do not have to discover a hidden explanation to begin.</p><p>Comparison revisions, annotations, and workflow responses are prewritten. The site does not call an AI model or evaluate your writing. A correct answer to a chapter question means your selection matches the prepared explanation; it is not an assessment of your overall ability.</p><p>The prompt and work-order forms produce instructions you can copy into an approved tool. You must supply the permitted documents there. Copying text, adding an example, or completing a checklist here does not grant permission or launch an agent.</p></section><section id="help-saving"><h2>Saving and backups</h2><p>Your text and selections save automatically in the current browser profile. A warning appears when browser storage is unavailable. In that case, download your work before leaving the page. The workflow demonstration’s current step and timer are temporary, but written reflections remain saved.</p><p><strong>Download readable notes</strong> creates a text document containing your entries and recorded responses. <strong>Download a backup</strong> creates a JSON file that this guide can restore. Use the backup when moving to another device, browser, or site address.</p><p>Restoring a backup replaces the entries saved in the current browser. Download the current work first when you need to keep it. An older backup may restore an older version of an answer; check its date before using it.</p><p>The updated guide retains the existing storage key and activity IDs. When it is served at the same site address in the same browser profile, earlier entries remain available. A downloaded HTML file or a different website address does not automatically share that storage. Use a backup to move the work.</p><p>Browser storage is not an approved client workspace. Use fictional or non-sensitive examples, and remember that other people using the same browser profile may be able to see the entries. Clearing browser data can remove them. This platform has no account recovery service.</p><a href="#/notebook" class="button compact">Open My saved work ${icon('arrow')}</a></section><section id="help-controls"><h2>Reading controls</h2><div class="actions reading-settings"><button class="button compact" data-action="font">Aa · Change reading size</button><button class="button compact" data-action="theme">Change theme</button><button class="button compact" data-action="motion" aria-pressed="${state.motion}">${state.motion?'Use system motion preference':'Reduce motion'}</button></div><p>Use the search button or Control/Command K to search across the guide. The Aa button changes reading size. The theme button switches the background between light and dark. In a chapter, focused reading hides the navigation until you select the control again.</p><p>On a small screen, the menu button opens the navigation and “In this chapter” opens the page contents. Help explanations can be opened by click, tap, or keyboard. Hovering or focusing a question-mark button also shows a short explanation; press Escape to dismiss it.</p><p>The site follows your system’s reduced-motion preference. You can also reduce animation with the button below. These preferences save in this browser.</p><button class="button compact" data-action="motion" aria-pressed="${state.motion}">${state.motion?'Use the system’s motion preference':'Reduce animation in the guide'}</button></section><section id="help-questions"><h2>Common questions</h2><details class="disclosure"><summary>Do I need an AI account?</summary><div class="inside"><p>No account is needed to read or complete the prepared exercises here. Using a prompt outside this guide requires access to an appropriate tool and permission for that use.</p></div></details><details class="disclosure"><summary>Will my instructor see my answers?</summary><div class="inside"><p>Not through this platform. Entries remain in your browser. Follow separate course instructions for any submission, and review what a downloaded file contains before sharing it.</p></div></details><details class="disclosure"><summary>Where did my earlier notes go?</summary><div class="inside"><p>Check that you are using the same browser profile and site address. A private window, another device, or the standalone HTML file may have separate storage. Restore an exported backup when available. If the original browser data was removed and no backup exists, this guide has no server copy to recover.</p></div></details><details class="disclosure"><summary>Why does loading an example ask to replace my entries?</summary><div class="inside"><p>The example fills the current form. It does not create a separate project. A confirmation appears before replacing an existing form, and unrelated notes are left unchanged. Download the form first when you want to retain both versions.</p></div></details><details class="disclosure"><summary>Why is some writing in the exercises deliberately awkward?</summary><div class="inside"><p>The original passages are teaching material for revision. They are identified as supplied passages and intentionally retain the problems students are asked to diagnose. The comparison versions and discussion were added for this guide.</p></div></details><details class="disclosure"><summary>What is a saved prompt versus a saved version?</summary><div class="inside"><p>Bookmarking a prompt template saves a reference to that template. The prompt builder stores your current fields and can also keep one separate assembled version. Saving a new version replaces that one snapshot after confirmation; download a prompt to keep additional copies.</p></div></details></section><p><a class="inline-link" href="#/sources">Read the source and editorial notes</a> for the teaching materials behind the guide.</p></div></div>${footer()}</div>`;}

function render404(){return `<div class="page"><div class="empty" style="margin:50px auto;max-width:700px">${icon('book')}<h1 style="font-family:Georgia;font-size:30px;margin-bottom:15px">That page is not in this edition.</h1><p>The link may be incomplete. The chapter outline and resource pages are still available.</p><a href="#/" class="button primary">Return to the field guide ${icon('arrow')}</a></div>${footer()}</div>`;}
function parseRoute(){const raw=(location.hash||'#/').slice(1);const [path,query='']=raw.split('?');const parts=path.split('/').filter(Boolean);const params=new URLSearchParams(query);if(!parts.length)return {type:'home',params};if(parts[0]==='read')return {type:'read',id:parts[1],params};if(parts[0]==='lab')return {type:'lab',id:parts[1],params};if(['chapters','labs','templates','prompts','glossary','notebook','sources','help'].includes(parts[0]))return {type:parts[0],params};return {type:'404',params};}
function route(){hideGuideTip();closeGuideHelp();closeSidebar();if(tocObserver)tocObserver.disconnect();currentRoute=parseRoute();if(currentRoute.type==='prompts'&&currentRoute.params.get('prompt')){promptCategory='All';promptQuery='';}currentChapter=currentRoute.type==='read'&&CHAPTERS.some(c=>c.id===currentRoute.id)?currentRoute.id:null;const f={home:renderHome,chapters:renderChapters,templates:renderTemplates,help:renderHelp,read:()=>renderChapter(currentRoute.id),labs:renderLabs,lab:()=>renderLab(currentRoute.id),prompts:renderPrompts,glossary:renderGlossary,notebook:renderNotebook,sources:renderSources};document.getElementById('main').innerHTML=(f[currentRoute.type]||render404)();renderSidebar();renderTopbar();applyPreferences();hydrateWidgets();restoreFields();updateStorageWarning();const c=CHAPTERS.find(c=>c.id===currentChapter);document.title=`${c?c.nav:({home:'Start here',chapters:'Chapters',templates:'Templates & worksheets',help:'How to use this guide',lab:LABS.find(l=>l.id===currentRoute.id)?.title,labs:'Exercises',prompts:'Prompt templates',glossary:'Glossary',notebook:'My saved work',sources:'Sources & guide notes'})[currentRoute.type]||'Guide'} · The AI-Enabled Lawyer`;requestAnimationFrame(()=>{window.scrollTo({top:0,behavior:'instant'});const section=currentRoute.params.get('section'),source=currentRoute.params.get('source');if(section!==null){const target=section==='quiz'?document.getElementById(`quiz-${currentChapter}`):document.getElementById(`section-${section}`);target?.scrollIntoView({behavior:'instant',block:'start'});}else if(source)document.getElementById(`source-${source}`)?.scrollIntoView({behavior:'instant'});else if(currentRoute.type==='help'&&currentRoute.params.get('topic'))document.getElementById('help-'+currentRoute.params.get('topic'))?.scrollIntoView({behavior:'instant'});else if(currentRoute.type==='prompts'&&currentRoute.params.get('prompt')){const target=document.getElementById('prompt-'+currentRoute.params.get('prompt'));if(target){const details=target.querySelector('details');if(details)details.open=true;target.scrollIntoView({behavior:'instant'});}}else{const title=document.querySelector('#main h1');if(title){title.setAttribute('tabindex','-1');title.focus({preventScroll:true});}}observeTOC();updateReadingProgress();});}
function restoreFields(){document.querySelectorAll('[data-save]').forEach(el=>{if(Object.prototype.hasOwnProperty.call(state.fields,el.dataset.save))el.value=value(el.dataset.save);});document.querySelectorAll('[data-check]').forEach(el=>el.checked=value(el.dataset.check)===true);}
function observeTOC(){if(!currentChapter)return;tocObserver=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('.toc a').forEach(a=>a.classList.toggle('current',a.dataset.toc===e.target.id.replace('section-','')));}});},{rootMargin:'-10% 0px -65% 0px',threshold:0});document.querySelectorAll('.prose>section').forEach(el=>tocObserver.observe(el));}
function updateReadingProgress(){const el=document.getElementById('reading-progress');if(!el)return;const height=document.documentElement.scrollHeight-window.innerHeight;el.style.width=currentChapter&&height>0?`${Math.min(100,Math.max(0,window.scrollY/height*100))}%`:'0%';}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('visible'),3200);}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw new Error('Copy unavailable');}toast('Copied to clipboard.');return true;}catch(e){toast('Clipboard access is blocked. Select the text and copy it directly.');return false;}}
function sharePage(section){if(!/^https?:$/.test(location.protocol)){toast('This is a local copy. Share the HTML file itself; a local page link will not open for someone else.');return;}copyText(pageLink(section));}
function pageLink(section){const url=new URL(location.href);if(section!==undefined&&currentChapter)url.hash=`/read/${currentChapter}?section=${section}`;return url.toString();}
function downloadFile(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportNotebook(){
 let text=`MY NOTES FROM THE AI-ENABLED LAWYER\nProfessor Joe Regalia\nDownloaded ${new Date().toISOString().slice(0,10)}\n\nThese are your own entries and recorded selections. They are not legal advice or instructor approval.\n\nREADING PROGRESS\n\n${CHAPTERS.map(c=>`${state.done.includes(c.id)?'[Read]':'[Not marked as read]'} ${c.nav}`).join('\n')}\n\nWRITTEN RESPONSES\n\n`;
 savedTextEntries().forEach(([k,v])=>text+=`${fieldLabel(k)}\n${'-'.repeat(Math.min(fieldLabel(k).length,60))}\n${v}\n\n`);
 text+='RECORDED SELECTIONS\n\n';
 savedSelections().forEach(([k,v])=>text+=`${fieldLabel(k)}\n${selectionText(k,v)}\n\n`);
 text+='CHAPTER QUESTIONS\n\n';
 Object.entries(state.quiz).forEach(([id,pick])=>{const c=CHAPTERS.find(c=>c.id===id);text+=`${c.nav}\n${c.quiz.q}\nYour selection: ${c.quiz.a[pick]}\nPrepared explanation: ${c.quiz.why}\n\n`;});
 text+='BOOKMARKED CHAPTERS\n\n';
 state.bookmarks.forEach(id=>text+=CHAPTERS.find(c=>c.id===id).nav+'\n');
 text+='\nSAVED PROMPT TEMPLATES\n\n';
 state.favorites.forEach(id=>{const p=PROMPTS.find(p=>p.id===id);text+=`${p.title}\n\n${p.text}\n\nSource: ${p.source}\n\n`;});
 downloadFile('my-ai-lawyering-notes.txt',text,'text/plain');toast('Your notes have been downloaded as a text file.');
}
async function importBackup(file){if(!file)return;if(file.size>2000000){toast('This backup is too large. Limit: 2 MB.');return;}try{const raw=JSON.parse(await file.text());if(raw.app!=='regalia-ai-field-guide'||raw.version!==1||!raw.state||typeof raw.state!=='object'||Array.isArray(raw.state))throw new Error('format');if(!confirm('Import this backup? It will replace the saved work in this browser. Export your existing work first if you need it.'))return;state=safeState(raw.state);saveState();route();toast('Backup imported into this browser.');}catch(e){toast('This is not a valid field-guide backup. No saved work was changed.');}}
function openSidebar(){if(state.focus&&currentRoute.type==='read'){state.focus=false;saveState();applyPreferences();return;}document.body.classList.add('sidebar-open');document.getElementById('main').inert=true;document.getElementById('topbar').inert=true;document.getElementById('sidebar').setAttribute('role','dialog');document.getElementById('sidebar').setAttribute('aria-modal','true');document.getElementById('sidebar').setAttribute('aria-label','Guide navigation');document.querySelector('[data-action=menu]')?.setAttribute('aria-expanded','true');document.querySelector('.sidebar .brand')?.focus();}
function closeSidebar(){const was=document.body.classList.contains('sidebar-open');document.body.classList.remove('sidebar-open');document.getElementById('main').inert=false;document.getElementById('topbar').inert=false;const sidebar=document.getElementById('sidebar');sidebar.removeAttribute('role');sidebar.removeAttribute('aria-modal');sidebar.removeAttribute('aria-label');document.querySelector('[data-action=menu]')?.setAttribute('aria-expanded','false');if(was)document.querySelector('[data-action=menu]')?.focus();}
const SEARCH_INDEX=[];
function buildSearch(){CHAPTERS.forEach(c=>{SEARCH_INDEX.push({title:c.nav,group:PARTS[c.part].name,text:c.desc,href:`#/read/${c.id}`});c.sections.forEach((s,i)=>SEARCH_INDEX.push({title:s.h,group:c.nav,text:strip(s.html),href:`#/read/${c.id}?section=${i}`}));});PROMPTS.forEach(p=>SEARCH_INDEX.push({title:p.title,group:'Prompt library',text:p.text,href:`#/prompts?prompt=${p.id}`}));GLOSSARY.forEach(([t,d,c])=>SEARCH_INDEX.push({title:t,group:'Glossary',text:d,href:`#/read/${c}`}));LABS.forEach(l=>SEARCH_INDEX.push({title:l.title,group:resourceType(l.id),text:l.desc,href:`#/lab/${l.id}`}));SEARCH_INDEX.push({title:'Stonebridge: dividend, projected savings, and leverage ratios',group:'Exercise or worksheet',text:STONEBRIDGE.original,href:'#/lab/stonebridge'},{title:'Falcon Medical: NDA and prospective assignee',group:'Exercise or worksheet',text:FALCON.original,href:'#/lab/falcon'});}
function openSearch(){closeSidebar();const dialog=document.getElementById('search-dialog');if(!dialog.open)dialog.showModal();const input=document.getElementById('global-search');input.value='';searchSelection=0;renderSearch('');input.focus();}
function highlight(text,query){if(!query)return esc(text);const lower=text.toLowerCase();const i=lower.indexOf(query.toLowerCase());return i<0?esc(text):esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+query.length))+'</mark>'+esc(text.slice(i+query.length));}
function renderSearch(q){const terms=q.toLowerCase().trim().split(/\s+/).filter(Boolean);searchMatches=terms.length?SEARCH_INDEX.map(x=>{const text=`${x.title} ${x.group} ${x.text}`.toLowerCase();const matches=terms.every(t=>text.includes(t));return {...x,score:matches?terms.reduce((n,t)=>n+(x.title.toLowerCase().includes(t)?12:0)+(x.group.toLowerCase().includes(t)?3:0)+1,0):0};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,20):[...LABS.filter(l=>['graph','promptbuilder','pause'].includes(l.id)).map(l=>({title:l.title,group:'Suggested activity',text:l.desc,href:`#/lab/${l.id}`})),{title:'Before you use AI',group:'Getting started',text:'Decide whether this assignment permits AI and how you would check its contribution.',href:'#/read/permission'}];searchSelection=0;document.getElementById('search-results').innerHTML=searchMatches.length?searchMatches.map((m,i)=>{const idx=m.text.toLowerCase().indexOf(terms[0]||'');const start=Math.max(0,idx-60);const snippet=(start?'…':'')+m.text.slice(start,start+175)+(m.text.length>start+175?'…':'');return `<a class="search-result ${i===0?'selected':''}" href="${m.href}" data-search-result="${i}"><span class="eyebrow">${m.group}</span><strong>${highlight(m.title,q)}</strong><p>${highlight(snippet,q)}</p></a>`;}).join(''):`<div class="search-empty">No matching passages. Try fewer words or a related idea, such as “missing evidence,” “NDA,” “harness,” or “thinking risk.”</div>`;document.getElementById('search-status').textContent=`${searchMatches.length} ${terms.length?'results':'suggestions'}`;}
function moveSearch(delta){if(!searchMatches.length)return;searchSelection=(searchSelection+delta+searchMatches.length)%searchMatches.length;document.querySelectorAll('.search-result').forEach((el,i)=>el.classList.toggle('selected',i===searchSelection));document.querySelector(`.search-result[data-search-result="${searchSelection}"]`)?.scrollIntoView({block:'nearest'});}
function goSearch(){const m=searchMatches[searchSelection];if(m){document.getElementById('search-dialog').close();if(location.hash===m.href)route();else location.hash=m.href;}}
function toggleSaved(key,id){state[key]=state[key].includes(id)?state[key].filter(x=>x!==id):[...state[key],id];saveState();}
document.addEventListener('click',async e=>{
 if(e.target.closest('.skip-link')){e.preventDefault();document.getElementById('main').focus();window.scrollTo({top:0,behavior:'instant'});return;}
 const searchResult=e.target.closest('[data-search-result]');if(searchResult){document.getElementById('search-dialog').close();if(searchResult.getAttribute('href')===location.hash)route();return;}
 const toc=e.target.closest('[data-toc]');if(toc){e.preventDefault();const id=toc.dataset.toc;const target=id==='quiz'?document.getElementById(`quiz-${currentChapter}`):document.getElementById(`section-${id}`);target?.scrollIntoView({behavior:state.motion?'instant':'smooth'});history.replaceState(null,'',toc.href);return;}
 const copy=e.target.closest('[data-copy-parent]');if(copy){await copyText(copy.closest(copy.dataset.copyParent)?.querySelector('pre')?.textContent||'');return;}
 const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
 if(handleWidgetAction(action,el))return;
 if(action==='search')openSearch();
 else if(action==='close-search')document.getElementById('search-dialog').close();
 else if(action==='menu')document.body.classList.contains('sidebar-open')?closeSidebar():openSidebar();
 else if(action==='close-menu')closeSidebar();
 else if(action==='theme'){state.theme=state.theme==='light'?'dark':'light';saveState();applyPreferences();}
 else if(action==='font'){state.font=state.font===17?19:state.font===19?16:17;saveState();applyPreferences();toast(`Reading size: ${state.font}px.`);}
 else if(action==='focus'){state.focus=!state.focus;saveState();applyPreferences();}
 else if(action==='motion'){state.motion=!state.motion;saveState();route();toast(state.motion?'Motion reduced.':'Motion follows your system preference.');}
 else if(action==='share')sharePage();
 else if(action==='section-share')sharePage(el.dataset.section);
 else if(action==='quiz'){const c=CHAPTERS.find(c=>c.id===el.dataset.id);state.quiz[c.id]=Number(el.dataset.choice);saveState();const wrap=document.getElementById(`quiz-${c.id}`);wrap.outerHTML=renderQuiz(c);document.querySelector(`#quiz-${c.id} [data-choice="${state.quiz[c.id]}"]`)?.focus({preventScroll:true});}
 else if(action==='complete'){toggleSaved('done',el.dataset.id);el.innerHTML=`${icon(state.done.includes(el.dataset.id)?'check':'book')} ${state.done.includes(el.dataset.id)?'Marked as read':'Mark chapter as read'}`;renderSidebar();toast(state.done.includes(el.dataset.id)?'Chapter marked as read.':'Chapter marked as unread.');}
 else if(action==='bookmark'){toggleSaved('bookmarks',el.dataset.id);el.innerHTML=`${icon('bookmark')} ${state.bookmarks.includes(el.dataset.id)?'Bookmarked':'Bookmark chapter'}`;el.setAttribute('aria-pressed',state.bookmarks.includes(el.dataset.id));}
 else if(action==='favorite'){toggleSaved('favorites',el.dataset.id);document.getElementById('prompt-list').innerHTML=renderPromptList();toast(state.favorites.includes(el.dataset.id)?'Template saved in My saved work.':'Template removed from My saved work.');}
 else if(action==='prompt-filter'){promptCategory=el.dataset.category;document.querySelectorAll('[data-action=prompt-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.category===promptCategory);b.setAttribute('aria-pressed',b.dataset.category===promptCategory);});document.getElementById('prompt-list').innerHTML=renderPromptList();}
 else if(action==='copy-prompt')copyText(PROMPTS.find(p=>p.id===el.dataset.id)?.text||'');
 else if(action==='export-md')exportNotebook();
 else if(action==='export-json'){downloadFile('ai-field-guide-backup.json',JSON.stringify({app:'regalia-ai-field-guide',version:1,exported:new Date().toISOString(),state},null,2),'application/json');toast('Backup exported. It includes your saved work.');}
 else if(action==='import')document.getElementById('import-file').click();
 else if(action==='reset-data'){if(confirm('Permanently clear this browser’s notes, worksheets, saved prompts, and reading progress? Export a backup first if you need it.')){state=safeState({theme:state.theme,font:state.font});saveState();route();toast('Saved work cleared from this browser.');}}
});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-save]')){setField(el.dataset.save,el.value);onWidgetInput(el.dataset.save,el);}if(el.id==='global-search')renderSearch(el.value);if(el.id==='prompt-search'){promptQuery=el.value;document.getElementById('prompt-list').innerHTML=renderPromptList();}if(el.id==='glossary-search'){glossaryQuery=el.value;document.getElementById('glossary-list').innerHTML=renderGlossaryList();}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('select[data-save]')){setField(el.dataset.save,el.value);onWidgetInput(el.dataset.save,el);}if(el.matches('[data-check]')){setField(el.dataset.check,el.checked);onWidgetInput(el.dataset.check,el);}if(el.matches('[data-read]')){const id=el.dataset.read;state.done=el.checked?[...new Set([...state.done,id])]:state.done.filter(x=>x!==id);saveState();renderSidebar();const count=document.querySelector('.notebook-stats .pill');if(count)count.textContent=`${state.done.length} / 16 chapters read`;}if(el.id==='import-file')importBackup(el.files?.[0]);});
document.addEventListener('keydown',e=>{const dialog=document.getElementById('search-dialog');if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();dialog.open?dialog.close():openSearch();return;}if(dialog.open){if(e.key==='ArrowDown'){e.preventDefault();moveSearch(1);}if(e.key==='ArrowUp'){e.preventDefault();moveSearch(-1);}if(e.key==='Enter'&&e.target.id==='global-search'){e.preventDefault();goSearch();}return;}if(document.body.classList.contains('sidebar-open')){if(e.key==='Escape'){e.preventDefault();closeSidebar();}if(e.key==='Tab'){const links=[...document.querySelectorAll('.sidebar a,.sidebar button')];const first=links[0],last=links.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}else if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();openSearch();}});
window.addEventListener('hashchange',route);
window.addEventListener('scroll',updateReadingProgress,{passive:true});
window.addEventListener('resize',()=>{if(innerWidth>780)closeSidebar();updateReadingProgress();});
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(APP_KEY,JSON.stringify(state));}catch(e){}});
document.getElementById('search-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close();}});
initHelp();
// Register field labels before any saved entry is opened, including on a first visit to My saved work.
Object.values(WIDGETS).forEach(render=>{render();});
buildSearch();
SEARCH_INDEX.push({title:"How to use this guide",group:"Help",text:"instructions resources differences areas saving backup notes templates worksheets exercises labs workbench studio playbook",href:"#/help"},{title:"Templates & worksheets",group:"Resources",text:"prompt builder studio agent work order process form reusable own assignment",href:"#/templates"},{title:"Chapters",group:"Reading",text:"Foundations Systems Building Leadership outline contents",href:"#/chapters"});
route();
