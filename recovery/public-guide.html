    "file": "The preceding guide in this conversation",
    "pages": null,
    "description": "The companion guide explains how to map tasks and review points using a fictional software-vendor assignment. It was developed in the preceding conversation; it does not reproduce the linked X article, which was not fully accessible."
  }
];
const PARTS = [
  {
    "name": "Foundations",
    "tag": "Deciding when and how to use AI",
    "desc": "Begin with the technology and your responsibilities. These chapters explain permission, independent thinking, and the checks needed before you rely on an answer."
  },
  {
    "name": "Systems",
    "tag": "Organizing and improving the work",
    "desc": "Develop useful prompts, organize sources, and map tasks that need more than one exchange. The writing chapters show how to assess and revise the result."
  },
  {
    "name": "Building",
    "tag": "Designing better services and tools",
    "desc": "Examine how a service works for its users before choosing technology. Learn how to specify a small tool and test whether it does what those users need."
  },
  {
    "name": "Leadership",
    "tag": "Learning from experience and leading others",
    "desc": "Bring your lessons together in a personal playbook and consider how AI should affect professional development, clients, and legal institutions."
  }
];
const CHAPTERS=[
  {
    "id": "lawyer",
    "part": 0,
    "title": "What will clients need from you?",
    "nav": "The lawyer’s role",
    "desc": "AI can help produce the work, but you still have to decide what the client needs and whether the result deserves their trust. That responsibility is the starting point for this guide.",
    "sources": [
      [
        "fall",
        "pp. 1–3, 18"
      ],
      [
        "student",
        "pp. 1–2"
      ]
    ],
    "sections": [
      {
        "h": "Start with the client’s problem",
        "html": "<p>A client asks whether they can end a contract with a software vendor. An AI tool may be able to draft a convincing answer, but you need to know why the client is asking. Perhaps repeated outages have made the service unusable. Perhaps the client mainly wants leverage to negotiate a better price. A recommendation that overlooks those differences could be legally careful and still miss the problem.</p><p>Before asking for a document, describe the decision it should help someone make. That gives you a reason to investigate particular facts and a standard for judging the work. It also helps you decide which parts of the assignment AI might help with.</p><p>The Fall guide asks whether you can defend the result, including its sources and reasoning, its consequences, and its fit for the client. We return to that question throughout the chapters. You should be able to explain why the recommendation makes sense, rather than pointing to the confidence with which a tool produced it.</p>"
      },
      {
        "h": "The work surrounding an AI answer",
        "html": "<p>The Fall guide uses six verbs to describe the lawyer’s work. They name responsibilities you may move among throughout an assignment; they are not a sequence of prompts to memorize.</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Responsibility</th><th scope=\"col\">What you would do</th></tr></thead><tbody><tr><th scope=\"row\">Frame</th><td>Find out what problem the client needs to solve, then identify the legal questions that bear on it.</td></tr><tr><th scope=\"row\">Judge</th><td>Choose among imperfect options after considering the relevant law and facts alongside practical consequences.</td></tr><tr><th scope=\"row\">Design</th><td>Plan how the work will get done and where a person needs to review it.</td></tr><tr><th scope=\"row\">Counsel</th><td>Help the client understand uncertainty and make a choice that fits their circumstances.</td></tr><tr><th scope=\"row\">Challenge</th><td>Examine the assumptions behind a proposed answer and give serious attention to the strongest reasons to disagree.</td></tr><tr><th scope=\"row\">Own</th><td>Accept responsibility for what you advise or allow others to rely on, including work prepared with AI.</td></tr></tbody></table></div><p>In the vendor example, you might begin by clarifying the client’s business objective, review the contract, and then return to the objective when choosing among remedies. Good work often requires that return trip.</p>"
      },
      {
        "h": "Why planning and supervision belong in legal training",
        "html": "<p>The source guide describes an expanded set of roles for lawyers, including project manager, systems architect, and AI-agent manager. Those labels can sound more technical than the underlying work. A project manager decides what happens first and who is responsible. A systems architect makes a recurring process easier to follow and check. An agent manager gives an AI system a defined assignment and limits what it may do without approval.</p><p>These responsibilities sit alongside counseling and professional judgment. They also include building useful tools and leading the people who will use them. You do not need a new job title to practice any of this. Start by being specific about how a familiar assignment should proceed.</p><p>For example, tell an assistant what source material to use, what to do when a document is missing, and what you need to see before approving the next step. Later chapters apply those same decisions to AI-assisted work.</p>"
      },
      {
        "h": "Choose a contribution you can evaluate",
        "html": "<p>For your first experiment, choose work you understand well enough to assess. Rather than asking AI to handle an entire matter, identify a contribution that would help you make progress. You might ask it to compare two provisions after you have read them, or to identify questions a skeptical reader would ask about an argument you have developed.</p><p>Then decide how you will judge the response. A useful comparison should preserve the provisions’ differences and point you to the relevant language. A useful critique should engage with your actual reasoning. Neither is useful merely because it is polished.</p><p>This is how the exercises in the guide are intended to work. You make an initial attempt, examine a different approach, and decide what deserves to carry forward.</p>"
      },
      {
        "h": "Try applying this to a familiar assignment",
        "html": "<p>Choose a fictional assignment or one you can describe without sensitive information. In the space below, explain what the client needs to decide and where your judgment would matter even if AI supplied a strong draft. A few sentences are enough.</p><div class=\"exercise\"><label for=\"exercise-role\">Your example</label><textarea id=\"exercise-role\" data-save=\"exercise-role\" placeholder=\"Describe the client’s decision and the part you would need to handle yourself.\"></textarea><p class=\"small muted\">Your answer saves in this browser and appears under My saved work. It is not submitted to your instructor.</p></div><p>The next chapter explains the AI terms you need to understand the choices in these examples. You can also use the glossary whenever an unfamiliar term comes up.</p>"
      }
    ],
    "quiz": {
      "q": "After receiving a convincing recommendation, what should the lawyer establish before relying on it?",
      "a": [
        "Whether a shorter version would be easier for the client to read.",
        "Whether the recommendation is supported and fits the client’s actual circumstances.",
        "Whether the tool can produce the same recommendation in another style."
      ],
      "correct": 1,
      "why": "Readability may matter, but it does not establish that the recommendation is sound. The lawyer needs to examine its basis and suitability for the client."
    }
  },
  {
    "id": "basics",
    "part": 0,
    "title": "How AI works, and what that means for your work",
    "nav": "Understanding AI",
    "desc": "You do not need to understand every engineering detail to work effectively with AI. You do need to know where an answer comes from, what the system can access, and what remains for you to check.",
    "sources": [
      [
        "student",
        "pp. 2–9, 19–22"
      ],
      [
        "fall",
        "p. 14"
      ]
    ],
    "sections": [
      {
        "h": "Distinguish a generated answer from a checked source",
        "html": "<p><strong>Artificial intelligence</strong> is a broad category. Predictive AI classifies information or estimates outcomes; generative AI creates content. The language systems used in this guide rely on large language models, often shortened to LLMs.</p><p>A language model learns patterns during training. When you ask it a question, the answer may draw on those learned patterns, material you supplied, or sources retrieved through a connected tool. Those are different ways of producing an answer, and they matter when you assess it.</p><p>A response generated without looking up a source is not a record of what that source says. The Student guide illustrates the problem with fabricated legal citations: a citation can look entirely plausible even though the case does not exist. Smaller errors matter too. A summary might turn an allegation into an established fact, or omit a qualification that changes the rule.</p><p>The term <strong>hallucination</strong> describes inaccurate or invented content of this kind. Do not look only for dramatic fabrications. Check whether the response faithfully represents the material you would rely on.</p>"
      },
      {
        "h": "The model and the application do different jobs",
        "html": "<p>The Student guide compares the model to an engine and the surrounding software to the rest of a car. That surrounding system is sometimes called a <strong>harness</strong>. It includes the tools and controls that make the model useful in a particular setting.</p><p>For example, an application may let the model search a document collection, use a calculator, or draft a message. The application also determines which of those actions are available and how approval works. Two products using a similar model can therefore support quite different ways of working.</p><p>When evaluating a product, ask to see how it handles your assignment. Can you inspect the sources behind a response? What information does the application retain? Can you prevent it from sending a message until you approve it? Answers to those questions tell you more about the proposed use than the model’s name alone.</p>"
      },
      {
        "h": "Keep important instructions outside a long conversation",
        "html": "<p>The <strong>context window</strong> is the amount of information a model can consider at once. The Student guide describes it as working memory. In a long project, earlier material may be omitted or compressed, so you should not assume that an important instruction remains available just because you mentioned it before.</p><p>Keep the current assignment and important findings in an organized reference document. When you begin another session, provide the relevant version and ask the system to identify anything it cannot access. This makes it easier to discover a gap before it shapes the work.</p><p>You will also encounter the word <strong>token</strong>, a small unit used to measure model input and output. You rarely need to count tokens yourself for the activities here. Focus instead on whether the tool has the right material and whether you can verify that it used it accurately.</p><p>Memory features, retention settings, and data-use terms depend on the actual product and account. Check them rather than treating the explanation of a context window as an answer to a confidentiality question.</p>"
      },
      {
        "h": "A few other terms you will encounter",
        "html": "<div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Term</th><th scope=\"col\">What it means here</th></tr></thead><tbody><tr><th scope=\"row\">Retrieval, often called RAG</th><td>The system finds material in a source collection and uses it when composing an answer. You still need to check whether the right material was found and interpreted correctly.</td></tr><tr><th scope=\"row\">Reasoning model</th><td>A model designed to spend additional effort working through a problem. Its conclusions still require appropriate review.</td></tr><tr><th scope=\"row\">Agent</th><td>A system that can pursue an assignment across several actions, such as reading documents and preparing a comparison. You need to know what it may do and when it must ask for approval.</td></tr><tr><th scope=\"row\">Prompt injection</th><td>Instructions placed inside material the system reads that try to redirect its behavior. A document’s contents should not override the instructions governing the assignment.</td></tr></tbody></table></div><p>The glossary explains these terms in more detail and links to their chapters. You do not need to learn all the vocabulary before beginning the exercises.</p>"
      },
      {
        "h": "Test the assignment you actually plan to delegate",
        "html": "<p>The Student guide describes capability as uneven: a system may handle one difficult-looking task well and stumble on another that seems easier. The practical response is to test the kind of work you intend to assign, using material whose important features you understand.</p><p>For a document comparison, begin with a small example in which you already know the material differences. Check whether the response finds them without inventing additional ones. Then try an example with a missing page or conflicting language and observe whether the system notices.</p><p>Keep the result of the test, including what failed. Later chapters show how to build those observations into a repeatable review process. For now, the important habit is to judge performance on your work rather than assuming that a persuasive demonstration answers the question.</p>"
      }

    "title": "Decide whether AI belongs in the assignment",
    "nav": "Before using AI",
    "desc": "Before opening a tool, work out whether this particular use is permitted and how you would check the result. A tool’s ability to produce an answer does not settle whether you should ask for one.",
    "sources": [

    "sections": [
      {
        "h": "Ask about the proposed use, not AI in the abstract",
        "html": "<p>Permission can differ within the same course or matter. An instructor may allow feedback on a draft but require you to write the draft yourself. A workplace may approve one system for a class of documents while prohibiting those documents in another system. Start with the rules that govern the task in front of you.</p><p>The Fall guide asks five questions: Is the use allowed? Is the input safe? What happens if the output is wrong? Can you verify it? Should you do the first pass yourself? Work through them before you decide what to delegate.</p><p>Being able to verify a result means more than intending to read it carefully. Name the material or person that would let you check it. For example, a contract summary can be compared with the signed agreement and its amendments. A legal proposition needs an appropriate authority check.</p>"
      },
      {
        "h": "Use the questions to make a practical plan",
        "html": "<p>The worksheet below helps you apply those questions to one assignment. Describe the task without entering private or client information, then answer the questions using what you know about the actual rules and system. When something is unresolved, use the final space to record how you will resolve it.</p><p>The response beneath the form follows your selections; it is not an AI assessment or permission from your instructor. Completing the worksheet does not authorize a use that the relevant rules prohibit.</p><div data-widget=\"preflight\"></div>"
      },
      {
        "h": "Consider the risk to your thinking as well as the work",
        "html": "<p>The Fall guide distinguishes external risk from internal risk. External risk concerns harm that follows from the work, such as advice based on a false fact or disclosure of protected information. Internal risk concerns the way an early AI answer may shape your own attention and judgment.</p><p>An exercise can have little immediate effect on anyone else and still be important for your learning. Asking AI to choose the issues before you read the facts may make it harder to notice a different way of understanding the problem. That is why “low stakes” does not automatically mean “let AI go first.”</p><p>Match your response to the risk. Work that could affect a client needs a review process appropriate to that consequence. Work intended to develop your skills also needs time for your own attempt. The same assignment may require both protections.</p>"
      },
      {
        "h": "Pause when you cannot resolve a material concern",
        "html": "<p>The semester checklist identifies reasons to stop and ask before continuing. These include unclear permission, sensitive information, a material source you cannot validate, and a request for broader access than the task requires. It also asks you to pause when you cannot explain an important conclusion or when the output sounds certain despite unresolved facts or law.</p><p>When that happens, describe the problem specifically. “I cannot find the source supporting this statement” gives an instructor or supervisor something to address. “I will be careful” does not resolve the missing source.</p><p>A useful record states what remains open and who needs to decide it. Return to the assignment only when you have a basis for proceeding, or change the task so it stays within the approved limits.</p>"
      }

    "desc": "Your first attempt gives you something to compare with AI’s response. It need not be polished, but it should reflect your own understanding of the problem.",

    "sections": [
      {
        "h": "Choose a first pass that fits the assignment",
        "html": "<p>Before asking for feedback on an argument, write down what you think the argument is and why it should succeed. Before asking for help organizing a document, identify its main points and the reader’s likely questions. Before requesting a sentence revision, try to explain what is getting in the reader’s way.</p><p>The amount of preliminary work depends on the task. You do not need to finish an entire brief before using AI to improve a heading. You do need enough understanding to recognize when a proposed heading changes the claim or puts emphasis in the wrong place.</p><p>The Student guide connects this habit to learning. Reading an opinion and struggling to synthesize its rule help develop the ability to do that work. When the purpose of an assignment is to build that ability, a finished answer from another source cannot stand in for your attempt.</p>"
      },
      {
        "h": "Assess your work before requesting feedback",
        "html": "<p>The two-page semester guide proposes a four-minute pause. State your current answer, identify the strongest and weakest parts of your reasoning, note what still needs checking, and decide what feedback would help.</p><p>Use the worksheet to record that assessment. After receiving permitted feedback elsewhere, return to compare an important suggestion with your original view. Explain why you would accept it, change it, or reject it. The timer is optional, and this page does not generate feedback on what you write.</p><div data-widget=\"pause\"></div>"
      },
      {
        "h": "Notice what changes when someone else chooses the priorities",
        "html": "<p>The employee-departure exercise asks you to choose which questions deserve attention first. Read the facts and make your own selections before opening the discussion. The point is to examine how a proposed set of priorities directs the rest of the work.</p><p>You are not being asked to decide the legal outcome. The packet does not provide controlling law. It gives you enough to identify factual questions and explain why they may matter.</p><div data-widget=\"priorities\"></div>"
      },
      {
        "h": "Return to the problem after considering AI’s suggestions",
        "html": "<p>The Fall guide calls this a divergence rule: begin with your own list, ask AI to expand or challenge it, and then create another list that includes at least one approach the model did not supply.</p><p>That final step matters because comparing alternatives is different from accepting the first useful-looking menu. Ask whether the client’s objective is still driving the analysis and whether a fact you initially considered important has disappeared.</p><p>You do not have to preserve your first view. Good feedback may change it substantially. What you should preserve is your ability to explain why it changed, using the source material and your own reasoning.</p>"
      },
      {
        "h": "Ask for help that makes you work through the question",
        "html": "<p>An AI tutor can ask a question, point you back to a passage, or identify a weakness for you to address. Those requests leave more of the analytical work with you than a request for a replacement answer.</p><div class=\"prompt-box\"><div class=\"prompt-top\"><span>A tutoring request to adapt</span><button class=\"text-btn\" data-copy-parent=\".prompt-box\">Copy these instructions</button></div><pre>I have read the supplied materials and written the answer below. Ask me questions before suggesting revisions. Begin with a question about the weakest part of my reasoning and wait for my response. Point me to relevant source passages rather than supplying a replacement answer. Distinguish what a source says from an inference you draw.\n\nPermitted materials: [identify them].\nMy answer: [paste your attempt].</pre></div><p>The semester checklist also calls for regular practice without AI. Use that practice to see what you can recall, explain, and write independently. A strong assisted draft is useful, but it does not answer those separate questions about your development.</p>"

  {
    "id": "ethics",
    "part": 0,
    "title": "Take responsibility for the work you use",
    "nav": "Professional responsibility",
    "desc": "The source guides apply familiar professional duties to AI-assisted work. Your task is to turn those duties into decisions about the assignment, the information involved, and the review it needs.",
    "sources": [
      [
        "fall",
        "p. 8"
      ],
      [
        "student",
        "pp. 10–11"
      ],
      [
        "short",
        "pp. 1–2"
      ]
    ],
    "sections": [
      {
        "h": "Apply the duties to the particular assignment",
        "html": "<p>The Fall guide treats AI as assistance with professional work, not as a substitute for the person responsible for it. The following overview explains its teaching framework. It does not replace the rules that apply in a particular jurisdiction, court, workplace, or course.</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Duty addressed in the guide</th><th scope=\"col\">What to consider before relying on AI-assisted work</th></tr></thead><tbody><tr><th scope=\"row\">Competence</th><td>Understand the tool well enough to recognize the relevant benefits and limits of the proposed use.</td></tr><tr><th scope=\"row\">Confidentiality</th><td>Establish that the system and use are approved for the information involved. Understand access and retention rather than assuming a paid account resolves them.</td></tr><tr><th scope=\"row\">Communication</th><td>Determine what the client needs to know and what disclosure the applicable rules, agreement, or circumstances require.</td></tr><tr><th scope=\"row\">Candor and accuracy</th><td>Do not present invented authority, distorted source language, or unsupported factual claims as established material.</td></tr><tr><th scope=\"row\">Supervision</th><td>Decide who reviews the work and prevent consequential actions from proceeding without the required approval.</td></tr><tr><th scope=\"row\">Reasonable fees</th><td>Follow the governing rules and agreement. AI use does not justify billing for time that was not worked.</td></tr><tr><th scope=\"row\">Independent judgment</th><td>Make the recommendation after considering the client’s circumstances and the relevant legal and practical factors.</td></tr></tbody></table></div>"
      },
      {
        "h": "Check what a source supports, not just whether it exists",
        "html": "<p>A case may exist and still fail to support the proposition attached to it. A quotation may be accurate while omitting language that changes its meaning. Verification therefore requires comparing the proposed claim with the relevant source in context.</p><p>For a factual statement, locate the record material and identify what it actually establishes. For a calculation, check both the arithmetic and the assumptions. For authority, consider its meaning and the checks needed to establish that it is appropriate to rely on.</p><p>An AI-assisted review can help identify possible problems, but its findings remain work for you to evaluate. The Fall guide expressly cautions that a second model is not an independent authority simply because it agrees or disagrees.</p>"
      },
      {
        "h": "Make approval an actual step in the process",
        "html": "<p>Instructions such as “ask me before sending” state what you expect. They are not, by themselves, a technical restriction on the system. When an application can take action, find out how the application prevents that action from happening without approval.</p><p>For a manually run workflow, you may control the handoff yourself by reviewing the result before starting the next task. An automated workflow needs an appropriate approval mechanism in the software. Test what happens when approval is absent.</p><p>The approval should also be specific. A reviewer needs to know which version they are approving and what will happen next. Adding a missing document, for example, is not the same as approving the conclusion drawn from it.</p>"
      },
      {
        "h": "Record the use accurately when a record is needed",
        "html": "<p>The semester checklist asks you to retain important instructions, materials, results, and checks when the assignment or risk calls for a record. It also provides a use-note template for situations in which disclosure is required. Adapt it to what you actually did.</p><div class=\"prompt-box\"><div class=\"prompt-top\"><span>Use note from the semester checklist</span><button class=\"text-btn\" data-copy-parent=\".prompt-box\">Copy these instructions</button></div><pre>I used [tool and version, if known] to [specific purpose]. I supplied [general description of permitted materials]. I independently checked [facts, authorities, quotations, calculations, or other items], accepted or revised [describe material contributions], and take responsibility for the final work.</pre></div><p>A statement that you checked something is meaningful only if you performed that check. The note records your responsibility; it does not excuse an unchecked result.</p>"
      },
      {
        "h": "Practice identifying the decision that cannot be delegated",
        "html": "<p>Consider this classroom variation: a supervising lawyer asks you to send an AI-generated case summary to a client before you have opened the cited opinion. The summary looks plausible, but the client may act on it that afternoon.</p><p>Identify what you need to verify and how you would explain the concern to the supervisor. Think about a useful response that addresses the deadline without representing unchecked work as ready for reliance.</p><p>The Fall guide discusses the subordinate lawyer’s continuing responsibility even when acting at another person’s direction. Use this example to consider how you would carry that responsibility into a difficult conversation. This is a discussion exercise, not a jurisdiction-specific answer to an actual matter.</p>"
      }
    ],

      "q": "You need to disclose your use of AI. What should the disclosure say?",
      "a": [
        "That AI was involved, so readers should independently check the work.",
        "That the tool generated the draft and is responsible for any errors.",
        "What you actually used the tool for and what you checked, without suggesting that disclosure replaces those checks."
      ],
      "correct": 2,
      "why": "The use note should describe what happened. It cannot establish that a source was verified when you did not read it, and it does not shift responsibility for the final work."
    }

  {
    "id": "method",
    "part": 1,
    "title": "Work with AI through a series of decisions",
    "nav": "Working with AI",
    "desc": "A useful exchange often involves an initial attempt, feedback, and a more focused request. The six practices in the source slides explain how to make those exchanges serve the work.",
    "sources": [
      [
        "slides",
        "pp. 8–35"
      ],
      [
        "fall",
        "p. 4"
      ],
      [
        "short",
        "p. 1"
      ]
    ],
    "sections": [
      {
        "h": "Understand what the six practices are for",
        "html": "<p>The Skills & AI-isms slides begin with your own work and then explain how to give direction, compare alternatives, and improve the next request. They also ask you to limit the size of the task to what both you and the tool can handle.</p><p>These are practices to draw on throughout an assignment. They do not require you to send six prompts every time. For a sentence revision, you might provide your draft and a style example, compare a few alternatives, and then ask for one further change. A more complicated analysis may need several rounds.</p><p>Select a practice below to read an explanation and a sample instruction. The examples are starting points to adapt, not buttons that send a request to an AI system.</p><div data-widget=\"method\"></div>"
      },
      {
        "h": "Request alternatives that differ in a useful way",
        "html": "<p>When you ask for multiple versions, explain what you want to compare. Five headings that say the same thing with different synonyms may give you little help. Headings that emphasize different reasons, or begin from different propositions, let you assess a writing decision.</p><p>You might ask for one version that leads with the governing rule and another that leads with the strongest fact. Compare the effect on the reader, then check whether either version overstates the approved substance.</p><p>An explanation of the difference is often more useful than another option. Ask the tool what each choice foregrounds and what a reader might misunderstand. You remain responsible for deciding whether that explanation is sound.</p>"
      },
      {
        "h": "Give feedback about the change you need",
        "html": "<p>A response such as “make it better” leaves the standard unclear. Point to the useful part and identify the problem that remains. You could explain that a proposed opening reaches the conclusion quickly but leaves out the condition on which it depends.</p><div class=\"prompt-box\"><div class=\"prompt-top\"><span>An example of a focused follow-up</span><button class=\"text-btn\" data-copy-parent=\".prompt-box\">Copy these instructions</button></div><pre>The opening now makes the recommendation clear, but it loses the uncertainty about when notice was received. Preserve that uncertainty and explain why it matters to the next step. Keep the conclusion at the beginning. Do not add a receipt date or assume the other termination requirements are satisfied.</pre></div><p>Feedback of this kind uses your understanding of the task. It gives the next revision a defined problem to solve, and it makes that revision easier for you to assess.</p>"
      },
      {
        "h": "Keep the amount of work manageable",
        "html": "<p>The slides ask a practical question about a ten-page rewrite: how will you meaningfully review everything the tool changed? A large response may leave you comparing altered wording, organization, and substance at once.</p><p>Choose a smaller unit when that would make the work easier to direct. Review the proposed organization before asking for prose, or work through the headings before revising the paragraphs beneath them. For analysis, establish the relevant requirements before comparing them with the facts.</p><p>Smaller is not always better. Keep questions together when their relationship matters. The aim is an assignment you can supervise and evaluate, not the largest possible number of steps.</p>"
      },
      {
        "h": "Keep the frameworks separate",
        "html": "<p>The guide contains several frameworks because they answer different questions. The <strong>five-stage responsible-use framework</strong> addresses the overall process: your initial thinking, AI assistance, substantive review, your decision, and a record of what you learned. The <strong>six collaboration practices</strong> in this chapter help you conduct the exchanges within that process.</p><p>The <strong>semester checklist</strong> is a reminder to use before, during, and after an assignment. It does not replace the reasoning behind those steps. The twelve-field agent work order, introduced later, helps specify a multi-step assignment with permission to use tools.</p><p>You do not need every framework open at once. Begin with the one that answers your current question. The navigation’s Exercises and Templates & worksheets sections distinguish activities that teach a skill from resources you can reuse on your own assignments.</p>"
      }
    ],

      "a": [

        "Keep the opening, identify the disputed fact, and explain how the next revision should qualify it.",
        "Request several alternatives and choose the one that sounds least certain."
      ],

    "id": "prompting",
    "part": 1,
    "title": "Give the AI a clear assignment",
    "nav": "Writing useful prompts",
    "desc": "A good prompt explains the work the way a good assignment would: enough context for the assistant to begin, enough direction to avoid predictable mistakes, and a clear description of what you need back.",
    "sources": [
      [
        "slides",

      [

    "sections": [
      {
        "h": "Describe the purpose before choosing the wording",
        "html": "<p>Start by deciding what would help you make progress. “Summarize this contract” could mean several things. A summary for a client deciding whether to sign should be organized differently from a list of provisions relevant to a disputed termination.</p><p>Explain the purpose and identify the materials the tool may use. Include what you already think, particularly when you want a critique rather than an independent draft. Then state what form of response you can meaningfully review.</p><p>The source slides treat prompting as part of a continuing process. A first request may lead to a question, a comparison, or a revised plan rather than immediately to finished prose.</p>"
      },
      {
        "h": "Use the source principles as choices, not a mandatory form",
        "html": "<div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Principle from the slides</th><th scope=\"col\">How to apply it</th></tr></thead><tbody><tr><th scope=\"row\">Role and audience</th><td>Explain whose perspective would help and who needs to understand the eventual work.</td></tr><tr><th scope=\"row\">Context, data, and goals</th><td>Provide the background that affects this task and identify the desired result.</td></tr><tr><th scope=\"row\">Annotated examples</th><td>Show an example and explain the feature you want the tool to learn from it.</td></tr><tr><th scope=\"row\">Options, expansion, and critique</th><td>Ask for alternatives or objections when those would help you make a decision.</td></tr><tr><th scope=\"row\">Result requirements</th><td>State the useful form and scope of the answer rather than leaving them to guesswork.</td></tr><tr><th scope=\"row\">Follow-up</th><td>Explain what worked and what needs to change before requesting another version.</td></tr><tr><th scope=\"row\">Organized steps</th><td>Separate dependent tasks when doing so makes their results easier to check.</td></tr><tr><th scope=\"row\">Improve the instructions</th><td>Ask the tool to identify ambiguity in your proposed assignment, then decide what to clarify.</td></tr><tr><th scope=\"row\">Reset and reuse</th><td>Keep useful instructions and current source information so another session can start from an accurate record.</td></tr><tr><th scope=\"row\">Avoid AI-isms</th><td>Describe the writing problems to avoid and review whether the result actually communicates the substance.</td></tr></tbody></table></div><p>You may need only a few of these in a small request. Adding irrelevant instructions makes the assignment harder to understand rather than more complete.</p>"
      },
      {
        "h": "Explain why an example works",
        "html": "<p>An example helps most when you identify what to notice. Instead of saying “write like this,” explain that a heading names the actor and action, states the proposition in a full sentence, and preserves an important limit.</p><p>Be clear about what the example does not supply. A passage used to demonstrate style should not introduce facts or law into another matter. Likewise, an example’s tone may suit one audience and be inappropriate for another.</p><p>When working from your own writing, ask for a description you can test against the passages. “Clear and persuasive” tells you little. A description of how your opening sentences identify the dispute gives you something to agree with or correct.</p>"
      },
      {
        "h": "Prepare instructions for your own assignment",
        "html": "<p>The form below assembles a prompt from what you enter. Use a non-sensitive example, or begin with one of the supplied examples and revise it. The form does not evaluate the quality of your instructions or call an AI system.</p><p>When the assembled prompt reflects the assignment you intend, copy it into a tool you are allowed to use and supply the permitted materials there. Check every bracketed placeholder before sending it. The prompt text and your saved version are separate from any answer that another tool produces.</p><div data-widget=\"promptbuilder\"></div>"
      },
      {
        "h": "Ask for clarification before the work begins",
        "html": "<p>For a substantial assignment, it can help to inspect the tool’s proposed approach before it drafts. This is another opportunity to catch a missing source or an assumption about what you want.</p><div class=\"prompt-box\"><div class=\"prompt-top\"><span>A request to review the assignment first</span><button class=\"text-btn\" data-copy-parent=\".prompt-box\">Copy these instructions</button></div><pre>Before performing this assignment, explain how you understand the task and identify anything important that is missing or ambiguous. Propose a manageable approach using only the permitted materials. Tell me which decisions you need me to make before you can proceed. Wait for my response before drafting.</pre></div><p>Review the proposed approach against the actual work. An organized plan can still choose the wrong priorities, so use your initial understanding to decide what should change.</p>"

  {
    "id": "graphing",
    "part": 1,
    "title": "Map the work before you automate it",
    "nav": "Mapping an AI workflow",
    "desc": "Graphing an AI workflow means showing how the work should proceed: what each task needs, where its result goes, and when a person must decide whether to continue. You can begin with a work plan on paper.",
    "sources": [
      [
        "graph",
        "sections 1–10"
      ],
      [
        "fall",
        "pp. 10–14"
      ]
    ],
    "sections": [
      {
        "h": "Use a map to make the work easier to supervise",
        "html": "<p>A broad request such as “review these documents and recommend whether to terminate the vendor” leaves many choices to the system. A workflow map makes some of those choices explicit before the recommendation is written.</p><p>For example, you could identify the contract’s requirements and build a factual timeline in separate tasks. A later task would compare the two, but it would wait until both were ready. A missing fact could send the work back for investigation instead of forward to a draft.</p><p>Each box in the map represents a task. A connecting arrow shows what follows or what depends on that task’s result. Some tasks belong to AI, some to ordinary software, and some to a person. The useful part is deciding how they fit together.</p><p>A <strong>knowledge graph</strong> is a different kind of map. It shows relationships among information, such as people, events, or documents. This chapter concerns the sequence of the work rather than a map of the facts.</p>"
      },
      {
        "h": "Begin with a defined question and approved materials",
        "html": "<p>Our fictional client is unhappy with a software vendor. The materials include a signed agreement, an amendment, service records, and correspondence. The client needs to know what would have to be established or done before terminating for the reported failures.</p><p>For this teaching example, assume that the reviewing lawyer has also supplied the relevant governing-law analysis. Reviewing the contract and correspondence alone would not resolve every legal issue. The assignment is to identify the contractual conditions, compare them with the available evidence, and explain what remains unresolved.</p><p>One detail will matter throughout: the contract starts a cure period when written notice is <strong>received</strong>. The initial correspondence shows a message was sent, but does not establish receipt. Keep that distinction in mind as you move through the example.</p>"
      },
      {
        "h": "Follow the example one step at a time",
        "html": "<p>Click a task in the diagram to read what it needs and what it should produce. Then use the button beneath the status explanation to move through the example. When evidence is missing, the exercise asks you to decide how to handle the gap before a recommendation can proceed.</p><p>The example is a prepared demonstration, not a connected AI agent. Its source checks and responses illustrate the proposed process. They do not inspect documents or establish a legal conclusion.</p><div data-widget=\"graph\"></div>"
      },
      {
        "h": "Give each task an assignment the next person can use",
        "html": "<p>A box labeled “Analyze” is not enough to guide the work. Identify the source material, the question to answer, and the result the next task needs. Also explain what to do when the information is incomplete.</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Part of the assignment</th><th scope=\"col\">Contract-review example</th></tr></thead><tbody><tr><th scope=\"row\">Question</th><td>Which provisions govern termination for the reported service failures?</td></tr><tr><th scope=\"row\">Materials</th><td>Read the agreement together with the supplied amendment and the lawyer’s assignment.</td></tr><tr><th scope=\"row\">Required result</th><td>Provide a table of requirements with the relevant language, source locations, and qualifications.</td></tr><tr><th scope=\"row\">Unresolved information</th><td>Identify missing referenced material or conflicts between provisions rather than supplying an assumed answer.</td></tr><tr><th scope=\"row\">Review</th><td>The lawyer checks the relevant provisions before the findings are used in the comparison.</td></tr></tbody></table></div><p>That result is useful beyond the first exchange. It tells the next task where the requirements came from and which questions have not yet been answered.</p>"
      },
      {
        "h": "Keep extraction separate from the eventual recommendation",
        "html": "<p>The contract review and timeline have different initial jobs. The first identifies what the documents require. The second identifies what the records show happened. Neither needs to settle whether termination is available.</p><div class=\"prompt-box\"><div class=\"prompt-top\"><span>Contract-review instructions</span><button class=\"text-btn\" data-copy-parent=\".prompt-box\">Copy these instructions</button></div><pre>Identify the provisions relevant to termination for the reported service failures. Read the agreement together with the amendment. For each requirement, give the relevant language and its location, including exceptions or qualifications. Identify any uncertainty about how the provisions fit together. Do not decide whether the client has satisfied the requirements yet.</pre></div><div class=\"prompt-box\"><div class=\"prompt-top\"><span>Timeline instructions</span><button class=\"text-btn\" data-copy-parent=\".prompt-box\">Copy these instructions</button></div><pre>Build a timeline from the supplied records and correspondence. Cite the document and location supporting each entry. Distinguish what a source establishes from what someone alleges, and preserve conflicting accounts. Identify missing information. Do not treat evidence that notice was sent as evidence of receipt, or conclude that a contractual requirement has been satisfied.</pre></div><p>You can run these requests manually in separate chats. Give each the shared assignment and the materials it actually needs; do not assume that information will carry across automatically.</p>"
      },
      {
        "h": "Carry sources and unresolved questions into the next task",
        "html": "<p>When the two results come together, the comparison should retain access to the underlying documents. Summaries are useful working materials, but a later task may need to inspect an exception or resolve an apparent inconsistency.</p><p>For each proposed conclusion, identify the supporting requirement and factual evidence. Keep missing or disputed information visible. “Notice was sent on June 4” and “notice was received on June 4” are different findings. Passing only an unqualified date to the next task could conceal the difference.</p><p>In this example, the lawyer might seek evidence of receipt or approve a recommendation that expressly preserves the unresolved question. That decision should travel with the findings so the drafting task does not quietly choose a different approach.</p>"
      },
      {
        "h": "Separate tasks when the separation helps",
        "html": "<p>Ask what a task needs before it can begin. The initial timeline can be assembled without a completed contract analysis. The recommendation needs the relevant requirements, factual findings, and the lawyer’s decisions, so it should wait.</p><p>Separate work does not have to run simultaneously. You may perform two tasks one after another while testing the plan manually. What matters first is whether the separation makes their questions clearer and their results easier to review.</p><p>Keep connected issues together when separating them would hide their relationship. Several agreements, for example, may need initial individual review followed by a deliberate review of how their provisions interact. A workflow should serve the analysis rather than fragment it.</p>"
      },
      {
        "h": "Specify what the final review must check",
        "html": "<p>A final instruction to “check your work” does not define a useful review. Tell the reviewer which materials to compare and what kinds of changes would matter.</p><div class=\"prompt-box\"><div class=\"prompt-top\"><span>Source-check instructions</span><button class=\"text-btn\" data-copy-parent=\".prompt-box\">Copy these instructions</button></div><pre>Compare the draft with the underlying documents, approved findings, and the lawyer’s instructions. Identify unsupported assertions, omitted qualifications, and passages that treat an unresolved question as settled. For each issue, quote the draft language, identify the relevant source and location, and propose a correction or a question for the lawyer. Report anything you could not check.</pre></div><p>Inspect the important findings yourself. Another AI response may identify something worth investigating, but its agreement does not establish that the draft is accurate. Also decide when a revision cycle ends and a person must resolve what remains.</p>"
      },
      {
        "h": "Test the map before building an automated version",
        "html": "<p>Begin with a manageable assignment and run the steps yourself. Save the work products and note where you needed to clarify an instruction or correct a handoff. This gives you something concrete to improve before adding software.</p><p>Then change the example. Suppose a new email establishes receipt. Which work needs reconsideration? The timeline, comparison, recommendation, and final review are affected. The contract extraction may remain useful, subject to checking whether the new evidence makes another provision relevant.</p><p>Compare the mapped approach with a simpler approach using the same materials. Record important errors and the time needed for lawyer review, not just how quickly a draft appears. A map is worth keeping when it helps the actual work.</p><p>Automation can manage the handoffs and enforce some pauses, but those mechanisms must be implemented and tested. A diagram or written instruction does not itself prevent an external action. <a class=\"inline-link\" href=\"#/read/agents\">The chapter on supervising agents</a> explains how to specify those limits.</p>"
      }
    ],
    "quiz": {
      "q": "The contract starts the cure period on receipt of notice, but the packet establishes only that an email was sent. What should happen next?",
      "a": [
        "Calculate from the sent date and mention the receipt issue in a footnote.",
        "Let the drafting task decide whether the missing date is important.",
        "Identify the missing evidence and seek the lawyer’s decision about further investigation or a qualified analysis."
      ],
      "correct": 2,
      "why": "The comparison should preserve the distinction between sending and receipt. The lawyer must decide how to handle the gap before later work treats an unproved date as established."
    }
  },

    "id": "harness",
    "part": 1,
    "title": "Organize the materials the AI needs",
    "nav": "Sources and saved instructions",
    "desc": "A well-written prompt cannot compensate for missing or outdated material. Organize the assignment so the system can identify the relevant sources and you can see what it used.",
    "sources": [
      [
        "fall",
        "p. 14"
      ],
      [
        "student",
        "pp. 4–8"
      ],
      [
        "slides",
        "pp. 33–37"
      ]
    ],
    "sections": [
      {
        "h": "Understand what belongs around the prompt",
        "html": "<p>The Fall guide calls the surrounding system a harness. It includes the sources and examples supplied for an assignment, the sequence of tasks, and the controls used to check results. The Student guide also uses the term for the software around a model.</p><p>You can begin practicing this kind of organization without building a new application. Prepare a reference folder containing the current assignment, permitted materials, and instructions you expect to reuse. Treat it as a deliberate source collection rather than an accumulation of everything that might be relevant.</p><p>A folder alone does not enforce permissions or perform a review. It helps you keep important information available; any software controls still need to be implemented in the system you use.</p>"
      },
      {
        "h": "Make the current materials easy to identify",
        "html": "<p>The following folder arrangement is an example for the vendor assignment, not a required format. Its purpose is to distinguish approved sources from unfinished work.</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Material</th><th scope=\"col\">What to include</th></tr></thead><tbody><tr><th scope=\"row\">Assignment</th><td>The question, intended reader, client objective, and limits on the work.</td></tr><tr><th scope=\"row\">Source documents</th><td>The signed agreement, relevant amendment, approved records, and lawyer-supplied governing-law material.</td></tr><tr><th scope=\"row\">Reviewed findings</th><td>The requirements table and timeline, with source locations and unresolved issues retained.</td></tr><tr><th scope=\"row\">Instructions and examples</th><td>The writing or analysis instructions you intend to reuse, with examples that show what a useful result looks like.</td></tr><tr><th scope=\"row\">Decisions and open questions</th><td>The reviewer’s decisions, current qualifications, and information still needed before proceeding.</td></tr></tbody></table></div><p>Use filenames and dates that make the current version apparent. A superseded draft can still be useful history, but it should not look like the controlling instruction.</p>"
      },
      {
        "h": "Check retrieval and interpretation separately",
        "html": "<p>Retrieval means finding relevant material in a source collection and making it available to the model. The answer then depends both on what was found and on how that material was interpreted.</p><p>When reviewing a result, ask whether an important source is absent. A perfectly accurate summary of the agreement may be incomplete if the amendment changes the relevant provision. Conversely, retrieving both documents does not guarantee that the response explains their relationship correctly.</p><p>Require the system to identify material it could not access and retain the source locations for important findings. Those details help you investigate an omission or misreading rather than relying on a general statement that the documents were reviewed.</p>"
      },
      {
        "h": "Prepare the next session to continue accurately",
        "html": "<p>At the end of a substantial session, save enough information for another person or AI session to continue without reconstructing the entire conversation. Identify the current question, reviewed conclusions, unresolved issues, and next task. Distinguish your decisions from suggestions that were not adopted.</p><div class=\"prompt-box\"><div class=\"prompt-top\"><span>Instructions for a session summary</span><button class=\"text-btn\" data-copy-parent=\".prompt-box\">Copy these instructions</button></div><pre>Prepare a record for the next session. State the current assignment and approved source versions. Summarize the findings with source locations, preserving disputed facts and unresolved questions. Identify decisions I made and suggestions I rejected. Describe the next task and what must be checked before it begins. Do not present an unreviewed proposal as an approved finding.</pre></div><p>Read the summary before reusing it. A saved record can carry an error forward just as easily as a conversation can.</p>"
      },
      {
        "h": "Connect organization with review",
        "html": "<p>The Fall guide proposes a sequence beginning with a human-defined question, followed by source-supported work, structured results, critique, source review, approval, and an update to the process. The pieces matter because each helps the next person understand what they are receiving.</p><p>For example, a source table makes a comparison possible, while a record of unresolved facts tells the reviewer what a recommendation must not assume. After review, a short note explaining a recurring error can improve the instructions for the next assignment.</p><p>This is also why an additional model is only one possible review aid. Verification still depends on appropriate evidence, reliable checks, and someone responsible for deciding what can be used.</p>"
      }
    ],
    "quiz": {
      "q": "You are continuing an assignment in a new AI session. What should you provide?",
      "a": [
        "The latest draft, leaving the new session to infer how you reached it.",
        "The reviewed findings and decisions, the unresolved questions, and access to the sources needed for the next task.",
        "The entire conversation, without identifying which parts are still accurate."
      ],
      "correct": 1,
      "why": "The next task needs to know what it may rely on and what remains unresolved. Keep the underlying sources available so a summary does not become an unsupported substitute for them."
    }
  },
  {
    "id": "agents",
    "part": 1,
    "title": "Supervise an AI system that takes several steps",
    "nav": "Supervising AI agents",
    "desc": "When AI can use tools and continue working between your instructions, you need to specify more than the final answer. You need to know what it may do along the way and when it must return to you.",
    "sources": [
      [
        "fall",
        "pp. 10–11"
      ],
      [
        "short",
        "pp. 1–2"
      ],
      [
        "student",
        "p. 8"
      ]
    ],
    "sections": [
      {
        "h": "Start with the work and the authority it requires",
        "html": "<p>An agent may pursue an assignment through several actions, such as reading documents, searching an approved collection, and preparing a comparison. The Fall guide emphasizes the chain of work because errors or unauthorized actions can occur before the final response reaches you.</p><p>For the vendor example, reading the approved correspondence is different from contacting the vendor for more information. Preparing a draft is different from sending it. Decide which actions belong in the assignment instead of granting access because a feature is available.</p><p>Also decide how you will inspect important intermediate results. A final paragraph may conceal the assumption on which the rest of the work depends. Seeing the requirements and factual findings before drafting gives you an opportunity to correct that assumption.</p>"
      },
      {
        "h": "Write the assignment before launching the agent",
        "html": "<p>The twelve-field work order in the Fall guide is a way to make those decisions explicit. It includes the desired result, permitted materials and tools, evidence requirements, stopping conditions, human approvals, and tests.</p><p>Use the form below to prepare instructions for a fictional or non-sensitive assignment. The supplied vendor example shows the intended level of detail. Completing this form does not launch an agent or change permissions in another application; it produces a work order you can review and implement there.</p><div data-widget=\"workorder\"></div>"
      },
      {
        "h": "Look for failures that polished prose can hide",
        "html": "<div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Possible failure</th><th scope=\"col\">What the reviewer should examine</th></tr></thead><tbody><tr><th scope=\"row\">Wrong objective</th><td>Did the system pursue the client’s actual need, or a convenient substitute such as producing a document quickly?</td></tr><tr><th scope=\"row\">An early error carries forward</th><td>Did later tasks rely on a factual assumption or requirement that was never established?</td></tr><tr><th scope=\"row\">A source or issue is missing</th><td>Does the final response look complete despite omitting required material or a relevant question?</td></tr><tr><th scope=\"row\">Unnecessary authority</th><td>Did the agent receive more access or permission to act than the assignment needed?</td></tr><tr><th scope=\"row\">A response verifies itself</th><td>Is another generated assertion being treated as independent support?</td></tr><tr><th scope=\"row\">Uncertainty disappears</th><td>Did the system guess instead of reporting that information was missing or conflicting?</td></tr></tbody></table></div><p>These are reasons to inspect the process, not merely add another instruction to the final drafting request. Choose the review point that would expose the particular failure.</p>"
      },
      {
        "h": "Check that the software enforces the important limits",
        "html": "<p>Written instructions describe what you want. Where a consequential action must not occur without approval, the actual system should enforce that requirement. Find out how permissions work and test what happens when the necessary approval is absent.</p><p>An instruction embedded in a source document should not gain authority over the assignment. Consider what the system would do if a document told it to ignore its instructions or share information elsewhere. The task’s data and permissions should remain limited even when the material contains an unexpected request.</p><p>Keep a clear route back to a person. The work order should specify when the system stops, who reviews the question, and what approval is needed to continue. “Proceed if confident” is not an adequate replacement for identifying unresolved information that requires judgment.</p>"
      },
      {
        "h": "Test ordinary cases and cases that should stop",
        "html": "<p>A useful test states the behavior you expect to observe. For a missing amendment, you might expect the system to report the gap and avoid a complete-contract conclusion. For a request to send an unapproved draft, the expected behavior is to stop before sending.</p><p>Include examples that are typical of the proposed work as well as known failure cases. After changing a prompt, model, or source collection, rerun important tests to see whether the change introduced a problem.</p><p>Record the result, not just the fact that a test was attempted. A named reviewer needs to assess failures and decide whether the system can be used for the intended purpose. The testing worksheet in the later chapters helps you prepare that review.</p>"
      }
    ],
    "quiz": {
      "q": "An agent asks to email the client while preparing an internal comparison. What should you consider first?",
      "a": [
        "Whether the agent can draft the email in the firm’s usual style.",
        "Whether sending an email is necessary and authorized for the assignment.",
        "Whether email access would let it finish the internal comparison sooner."
      ],
      "correct": 1,
      "why": "Permission should follow the defined task. Preparing an internal comparison does not by itself justify access to external communication, even when that access would be convenient."
    }
  },

    "id": "writing",
    "part": 1,
    "title": "Improve the writing without losing the analysis",
    "nav": "Writing and revision",
    "desc": "An effective revision helps the reader understand the point while preserving the facts and qualifications on which it depends. Use AI to explore choices you can explain, not just to produce smoother wording.",
    "sources": [
      [
        "slides",
        "pp. 20–24, 40–57, 78–86"
      ]
    ],
    "sections": [
      {
        "h": "Diagnose the problem before asking for a rewrite",
        "html": "<p>Begin by deciding what the paragraph should help its reader understand or do. Then look at what is preventing that result. The conclusion may be buried, a sentence may hide who acted, or a necessary connection between the rule and the facts may be missing.</p><p>Your diagnosis determines the useful request. “Make this concise” will not tell the tool that the reader first needs to know whether the dividend can be approved. Nor will it explain which condition must survive a shorter version.</p><p>When comparing revisions, read for substance as well as style. A clearer-looking sentence may narrow a rule, strengthen a conclusion, or remove uncertainty. Those changes require your judgment.</p>"
      },
      {
        "h": "Compare the effect of a stronger verb",
        "html": "<p>The fee-table example begins with an indirect description of what a table is intended to do. The source slides compare several requests for a revision, including a general clarity request and a more focused instruction to use a stronger verb.</p><p>Write your own revision before examining the alternatives. As you compare them, ask both whether the sentence is easier to read and whether investors still receive the same information about direct and indirect costs.</p><div data-widget=\"fee\"></div>"
      },
      {
        "h": "Use examples to teach a particular writing move",
        "html": "<p>The slides’ dog-toy example contrasts an abstract introduction about the “design, marketing, and sale” of a product with prose that explains what the seller made and how the toy resembles the whiskey bottle. The concrete description lets the reader picture the dispute before confronting its legal implications.</p><p>That is a useful feature to name when giving AI an example: introduce the people or objects involved, explain what happened, and choose details that help the reader understand the dispute. Do not ask the tool to import memorable phrases or facts from a different case.</p><p>The same principle applies to a routine client email. Rather than beginning with “With respect to your request,” you may be able to start with the decision the reader needs and then explain its basis. Whether that approach works depends on the purpose and audience.</p>"
      },
      {
        "h": "Put the unresolved condition where the reader will see it",
        "html": "<p>In the Stonebridge exercise, the question is whether a proposed dividend can be confirmed as permitted. The reported ratio falls below the contractual limit only when projected savings are included, and supporting materials for those savings have not been provided.</p><p>Your revision should help the reader understand that obstacle and the next step. Be careful not to turn insufficient information into a conclusion that the dividend is prohibited. Work from the supplied passage; no additional financial analysis is required for this editing exercise.</p><div data-widget=\"stonebridge\"></div>"
      },
      {
        "h": "Keep separate problems separate in the recommendation",
        "html": "<p>The Falcon exercise presents a proposed disclosure to a prospective assignee. A signed NDA is relevant, but the passage raises a question about whether its protections meet the agreement’s standard. It also identifies information the recipient does not currently need.</p><p>Explain both points without suggesting that removing unnecessary detail automatically resolves the NDA issue. Read the supplied passage carefully before deciding how to organize the recommendation.</p><div data-widget=\"falcon\"></div>"
      },
      {
        "h": "Ask for explanations you can compare with the draft",
        "html": "<p>When AI proposes a revision, ask it to identify changes that could affect meaning. Then compare that explanation with the actual source and draft. The explanation is another aid to review, not proof that every important change was identified.</p><div class=\"prompt-box\"><div class=\"prompt-top\"><span>A revision request to adapt</span><button class=\"text-btn\" data-copy-parent=\".prompt-box\">Copy these instructions</button></div><pre>Diagnose the paragraph before rewriting it. Explain what the reader needs to understand and what currently makes that difficult. Preserve the supplied facts, numbers, conditions, and uncertainty. Offer two versions with meaningfully different organization and explain the tradeoffs. Flag any proposed change that might affect the analysis for my decision. Do not add facts or legal conclusions.\n\nAudience and purpose: [describe them].\nParagraph: [paste it].</pre></div><p>After choosing a version, read it again as the intended reader. You should be able to explain the recommendation and its limits without returning to the prompt that produced it.</p>"
      }
    ],
    "quiz": {
      "q": "Stonebridge’s ratio is 4.68x with projected savings and 4.93x without them, against a 4.75x limit. No supporting material for the savings has been supplied. What should the revised advice preserve?",
      "a": [
        "The dividend is permitted because the borrower reported a ratio below the limit.",
        "The dividend is prohibited because the ratio exceeds the limit without the savings.",
        "The current record does not establish whether the savings qualify, so permission cannot yet be confirmed."
      ],
      "correct": 2,
      "why": "The exercise leaves a material question open. A revision can make that question easier to understand, but it cannot resolve it by making the prose more decisive."
    }

  {
    "id": "aiisms",
    "part": 1,
    "title": "Edit writing that sounds generic or mechanical",
    "nav": "Editing AI-isms",
    "desc": "The source slides use “AI-isms” to describe recurring writing habits that can distract readers or conceal thin analysis. Look at what the language does, rather than trying to determine who wrote it.",
    "sources": [
      [
        "slides",
        "pp. 58–77"
      ]
    ],
    "sections": [
      {
        "h": "Look beyond individual words",
        "html": "<p>A familiar word such as “moreover” may be perfectly useful in context. The problem arises when a draft repeatedly uses generic transitions, inflated emphasis, or the same sentence pattern instead of showing how its ideas relate.</p><p>The slides organize the review into four areas: words, sentences, formatting, and substance. That last area deserves particular attention. A passage can sound natural while offering no useful analysis of the client’s problem.</p><p>Use these categories to explain an editing decision. “This phrase repeats the point without adding a reason” gives you a basis for cutting it. “This sounds like AI” does not explain what the reader needs instead.</p>"
      },
      {
        "h": "Check how the habits affect the reader",
        "html": "<div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Area</th><th scope=\"col\">What to look for</th></tr></thead><tbody><tr><th scope=\"row\">Words</th><td>Generic emphasis or abstract business language that makes an ordinary point harder to understand. Replace it with the specific actor, action, or relationship when the source supports that detail.</td></tr><tr><th scope=\"row\">Sentences</th><td>Repeated contrasts, lists, hedges, or isolated short statements that give the paragraph a mechanical rhythm. Vary the construction according to the ideas rather than a fixed pattern.</td></tr><tr><th scope=\"row\">Formatting</th><td>Headings that interrupt a short explanation, equal space for issues of unequal importance, or lists where connected prose would better show the relationship.</td></tr><tr><th scope=\"row\">Substance</th><td>Rules without application, unranked risks, missing client context, or a recommendation that leaves the reader unsure what to do next.</td></tr></tbody></table></div><p>None of these is an authorship test. A human can write a weak paragraph with every habit listed, and AI-assisted prose can avoid them. The editing question is whether the passage does its job.</p>"
      },
      {
        "h": "Practice on a deliberately weak passage",
        "html": "<p>The passage below comes from the source slides and deliberately contains problems for discussion. Select a category to see prepared annotations, then record what you would address first. The page does not analyze your writing or infer whether a passage was written by AI.</p><div data-widget=\"aiisms\"></div>"
      },
      {
        "h": "Do not invent detail to make a revision feel concrete",
        "html": "<p>A vague recommendation often needs more information, not more confident prose. When the source does not identify the controlling authority or establish a material fact, name the gap. Do not supply a plausible citation, deadline, or number because it would improve the sentence.</p><p>This distinction matters in the source deck’s before-and-after examples. The platform does not adopt the unsupported data-retention rule and enforcement example on slide 66 as legal guidance. For substantive revision practice, use the supplied Stonebridge and Falcon passages, where the relevant conditions are provided.</p><p>An honest revision may explain what cannot yet be confirmed and what information is needed. That can be more useful to the reader than a polished recommendation that conceals the uncertainty.</p>"
      },
      {
        "h": "Describe your own style in terms you can apply",
        "html": "<p>The later slides ask you to examine writing you like and describe its observable habits. Consider what your opening sentences do, how your headings help a reader, and where you use more explanation. A useful description should make room for differences among documents and audiences.</p><p>Ask AI to help identify those habits, then challenge vague praise or rigid formulas. You do not need every paragraph to have the same length or every passage to follow a short–short–long rhythm. The aim is a description of your choices that you can use and revise.</p><div class=\"prompt-box\"><div class=\"prompt-top\"><span>Instructions for learning from your writing</span><button class=\"text-btn\" data-copy-parent=\".prompt-box\">Copy these instructions</button></div><pre>Read these approved samples of my writing and describe specific choices that help the reader. Use short examples to explain your observations. Pay attention to openings, headings, actors and verbs, sentence rhythm, paragraph development, and level of detail. Identify exceptions rather than imposing a uniform pattern. Avoid general praise. Do not rewrite the samples yet; I will review your description first.</pre></div><p>Save the description once it is accurate enough to guide another assignment. Pair it with examples and continue editing the resulting prose yourself.</p>"
      }
    ],
    "quiz": {
      "q": "A draft uses ordinary words but describes several risks without explaining their importance to this client. What needs attention?",
      "a": [
        "Replace the remaining formal words with shorter ones.",
        "Explain how the relevant facts and rules bear on the client’s decision.",
        "Vary the paragraph lengths so the discussion feels less repetitive."
      ],
      "correct": 1,
      "why": "Changes in wording or paragraph length will not supply the missing analysis. The reader needs to understand what the risks mean in this matter and why a proposed response makes sense."
    }
  },
  {
    "id": "process",
    "part": 2,
    "title": "Improve the way a legal service works",
    "nav": "Improving a process",
    "desc": "Before choosing technology, understand how the service works for the person using it. The most useful change may be a clearer question or a removed step rather than another AI feature.",
    "sources": [
      [
        "fall",
        "pp. 12–13"
      ]
    ],
    "sections": [
      {
        "h": "Describe the result from the client’s perspective",
        "html": "<p>A process can produce the expected document while leaving the client with unnecessary effort or uncertainty. An intake form, for example, may collect information the team does not use while failing to explain what happens after submission.</p><p>The Fall guide begins process improvement with the client’s desired outcome. Describe what should be different when the work is complete. Then examine the current process closely enough to see where it helps or obstructs that outcome.</p><p>Include the people who handle the work between formal legal tasks. A delay may arise because responsibility for a follow-up is unclear, not because drafting takes too long.</p>"
      },
