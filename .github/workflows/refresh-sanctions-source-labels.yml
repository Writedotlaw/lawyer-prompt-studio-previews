name: Refresh sanctions source labels
on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-sanctions-source-labels.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm baseline and apply presentation-only changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('sanctions-explorer/index.html')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='3faf1ae310898f9a9a161bb85e21b608b05204f4580177b20123bce9b8bbfffd','Published source changed'
          PY
          python .github/sanctions-build/refresh-source-labels.py sanctions-explorer
      - name: Build and verify the updated release
        working-directory: sanctions-explorer
        run: |
          python build.py
          node tests/core.test.cjs
          node tests/findings.test.cjs
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          html=Path('index.html').read_bytes()
          assert hashlib.sha256(html).hexdigest()=='516047123b1b9dab4d2c509325d0c465e0e7e15a61bc72b43f515cc5470b50c6','Build differs from browser-tested release'
          assert not re.search(r'\bKyle\b|\bBahr\b|kylebahr',html.decode(),re.I)
          assert hashlib.sha256(Path('data/source.csv').read_bytes()).hexdigest()=='a7c4346622ba0464828a617fbfb26fa4c2408602fd35ef925ec5367ef7b7d61c'
          print('Verified exact match with browser-tested release; source records unchanged.')
          PY
      - name: Prepare publication tree without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request,json,os,base64,hashlib,zipfile
          from pathlib import Path
          root=Path('sanctions-explorer');out=Path('release');out.mkdir(exist_ok=True)
          files=sorted(p for p in root.rglob('*') if p.is_file() and not any(x in p.parts for x in ('__pycache__','results','verification','.git')) and p.name!='editable-project.zip')
          with zipfile.ZipFile(root/'editable-project.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:z.write(p,str(Path('AI-Sanctions-Explorer')/p.relative_to(root)))
          names=['README.md','src/app.js','src/content.js','src/findings-data.js','src/findings.js','tests/findings-browser.py','index.html','editable-project.zip']
          api='https://api.github.com/repos/Writedotlaw/lawyer-prompt-studio-previews'
          def request(path,payload=None):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Write-law-source-label-update'}
              body=None
              if payload is not None:body=json.dumps(payload).encode();headers['Content-Type']='application/json'
              with urllib.request.urlopen(urllib.request.Request(api+path,data=body,headers=headers),timeout=60) as r:return json.load(r)
          parent=request('/git/ref/heads/main')['object']['sha']
          assert parent==os.environ['GITHUB_SHA'],'Main changed while building'
          base=request('/git/commits/'+parent)['tree']['sha'];entries=[]
          for name in names:
              p=root/name
              blob=request('/git/blobs',{'content':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'})
              entries.append({'path':str(p),'mode':'100644','type':'blob','sha':blob['sha']})
          tree=request('/git/trees',{'base_tree':base,'tree':entries})
          manifest={'parent_sha':parent,'tree_sha':tree['sha'],'htmlSha256':hashlib.sha256((root/'index.html').read_bytes()).hexdigest(),'recordsUnchanged':2036,'studyValuesUnchanged':True,'url':'https://writedotlaw.github.io/lawyer-prompt-studio-previews/sanctions-explorer/'}
          (out/'publication-manifest.json').write_text(json.dumps(manifest,indent=2))
          (out/'editable-project.zip').write_bytes((root/'editable-project.zip').read_bytes())
          print('PUBLICATION_MANIFEST='+json.dumps(manifest),flush=True)
          PY
      - name: Preserve verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-label-update-ready
          path: release/
          retention-days: 14
          if-no-files-found: error
