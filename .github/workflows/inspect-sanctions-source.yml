name: Inspect sanctions project sources
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-sanctions-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the requested public site and its licensed data source
        run: |
          mkdir -p source-inspection
          python - <<'PY'
          import urllib.request, urllib.parse, json, re
          from html.parser import HTMLParser
          from pathlib import Path
          out=Path('source-inspection')
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Write.law research visualization; public source inspection'})
              with urllib.request.urlopen(req,timeout=40) as r:
                  data=r.read(25000000)
                  return data,dict(r.headers)
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.scripts=[]; self.current=None
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='a':
                      self.current={'href':d.get('href',''),'text':''}; self.links.append(self.current)
                  if tag=='script': self.scripts.append(d.get('src','inline'))
              def handle_endtag(self,tag):
                  if tag=='a': self.current=None
              def handle_data(self,data):
                  if self.current is not None: self.current['text']+=data
          report={}
          urls={'reference':'https://kylebahr.netlify.app/2000/expanded/','database':'https://www.damiencharlotin.com/hallucinations/'}
          for key,url in urls.items():
              body,headers=get(url)
              (out/(key+'.html')).write_bytes(body)
              parser=Links(); parser.feed(body.decode('utf-8','replace'))
              report[key]={'url':url,'bytes':len(body),'scripts':parser.scripts,'links':parser.links}
              if key=='database':
                  candidates=[x for x in parser.links if 'csv' in (x['href']+' '+x['text']).lower()]
                  for i,entry in enumerate(candidates):
                      target=urllib.parse.urljoin(url,entry['href'])
                      if urllib.parse.urlparse(target).hostname!='www.damiencharlotin.com': continue
                      try:
                          data,h=get(target)
                          (out/f'database-export-{i}.csv').write_bytes(data)
                          report['export']={'url':target,'bytes':len(data),'headers':h,'first':data[:1800].decode('utf-8','replace')}
                          break
                      except Exception as exc: report['export_error']=str(exc)
          (out/'manifest.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k not in ['reference','database']},indent=2))
          print('REFERENCE_SCRIPTS='+json.dumps(report['reference']['scripts']))
          print('DATABASE_SCRIPTS='+json.dumps(report['database']['scripts']))
          print('REFERENCE_LOCAL_LINKS='+json.dumps([x for x in report['reference']['links'] if not x['href'].startswith(('http','#'))]))
          PY
      - name: Preserve the public inputs for implementation and checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sanctions-source-inspection
          path: source-inspection/
          retention-days: 3
          if-no-files-found: error
