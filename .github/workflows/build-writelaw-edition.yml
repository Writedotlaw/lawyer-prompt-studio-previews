name: Build and review Write.law public edition
on:
  push:
    branches: [writelaw-public-edition-20260908]
    paths:
      - .github/workflows/build-writelaw-edition.yml
      - public-edition/rebuild.json
permissions:
  contents: write
concurrency:
  group: writelaw-public-edition-build
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read the isolated editorial revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the revised guide and verify content compatibility
        run: |
          python -m pip install --disable-pip-version-check mistune==3.2.1 playwright==1.55.0
          python public-edition/build.py
          python public-edition/polish.py
          python -m playwright install --with-deps chromium
      - name: Run the existing regression suite against the local revision
        run: |
          set -euo pipefail
          mkdir -p .github/ai-guide-tests/results
          python - <<'PY'
          from pathlib import Path
          import json
          Path('.github/ai-guide-tests/results/deployment-result.json').write_text(json.dumps({'previewUrl':'http://127.0.0.1:8765','scope':'local editorial build','deployed':False}))
          PY
          python -m http.server 8765 --directory public-edition/dist > /tmp/writelaw-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python .github/ai-guide-tests/check_public_site.py
      - name: Review all reading layouts and previous-edition saved work
        run: python public-edition/extended_review.py
      - name: Stage only the successful build on the isolated editorial branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          def call(path,body=None):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+path,data=json.dumps(body).encode() if body is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST' if body is not None else 'GET')
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          branch='writelaw-public-edition-20260908'
          current=call('/git/ref/heads/'+branch)['object']['sha']
          commit=call('/git/commits/'+current)
          entries=[]
          for name in ['index.html','vercel.json','release.json']:
              path=Path('public-edition/dist')/name
              blob=call('/git/blobs',{'content':base64.b64encode(path.read_bytes()).decode(),'encoding':'base64'})
              entries.append({'path':str(path),'mode':'100644','type':'blob','sha':blob['sha']})
          tree=call('/git/trees',{'base_tree':commit['tree']['sha'],'tree':entries})
          new=call('/git/commits',{'message':'Stage tested Write.law public edition; no production deployment','tree':tree['sha'],'parents':[current]})
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/refs/heads/'+branch,data=json.dumps({'sha':new['sha'],'force':False}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='PATCH')
          with urllib.request.urlopen(req,timeout=60) as response:assert response.status==200
          Path('public-edition/staged-build.json').write_text(json.dumps({'commit':new['sha'],'branch':branch,'deployed':False},indent=2))
          print('STAGED_REVIEWED_BUILD',new['sha'])
          PY
      - name: Mark the reports as pre-publication tests
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.github/ai-guide-tests/results')
          file=root/'public-browser-report.json'
          if file.exists():
              report=json.loads(file.read_text())
              report.update(scope='Local pre-publication regression test',deployed=False)
              file.write_text(json.dumps(report,indent=2))
              print('LOCAL_TEST_RESULT',report.get('passed'),report.get('failed'))
          Path('public-edition/BUILD-STATUS.md').write_text('# Write.law public edition\n\nThis package is a review build. This workflow does not authenticate with Vercel or change either live site. The source, editable site, complete HTML build, and test reports are included.\n')
          PY
      - name: Preserve the review build, editable chapters, and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writelaw-public-edition-review-${{ github.run_id }}
          path: |
            public-edition/
            .github/ai-guide-tests/results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
