name: Finish reading-first guide at the original URL
on:
  push:
    branches: [writelaw-guide-first-20260908]
    paths: [.github/workflows/resume-reading-guide-20260908-final.yml]
permissions:
  contents: write
concurrency:
  group: ai-guide-original-vercel-publication
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Read the existing authored revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Recover the six reviewed source files without replacing later fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,json,lzma,tarfile
          root=Path('guide-first-transfer')
          manifest=json.loads((root/'manifest.json').read_text())
          pieces=[]
          for item in manifest['chunks']:
              data=(root/item['file']).read_bytes()
              assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256']
              pieces.append(data)
          payload=base64.b64decode(b''.join(pieces),validate=True)
          assert hashlib.sha256(payload).hexdigest()==manifest['sha256']
          expected={x['file']:x['sha256'] for x in manifest['sourceFiles']}
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(payload)),mode='r:') as archive:
              members=archive.getmembers()
              assert len(members)==len(expected) and {m.name for m in members}==set(expected)
              for member in members:
                  assert member.isfile() and not member.issym() and not member.islnk()
                  path=Path(member.name)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0]=='guide-first'
                  data=archive.extractfile(member).read()
                  assert hashlib.sha256(data).hexdigest()==expected[member.name]
                  path.parent.mkdir(parents=True,exist_ok=True)
                  if not path.exists():path.write_bytes(data)
          print('Existing authored revision recovered. No live site has changed.')
          PY
      - name: Build and test the reading-first guide
        run: |
          python -m pip install --disable-pip-version-check mistune==3.2.1 playwright==1.55.0
          python -m playwright install --with-deps chromium
          python guide-first/build_guide.py
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          test=subprocess.run(['python','guide-first/test_guide.py'])
          if test.returncode:
              report=json.loads(Path('guide-first/test-evidence/browser-report.json').read_text())
              failed=[x for x in report['checks'] if not x['passed']]
              expected='390px #/sources: no document overflow'
              if len(failed)!=1 or failed[0]['check']!=expected:
                  raise SystemExit('The existing review found a failure other than the known mobile source layout. Publication stopped.')
              manifest=json.loads(Path('guide-first-transfer/manifest.json').read_text())
              cssfiles=[Path(x['file']) for x in manifest['sourceFiles'] if x['file'].endswith('.css')]
              assert len(cssfiles)==1,'Cannot safely identify the source stylesheet.'
              correction='''\n/* Mobile sources: allow text and grid items to shrink and wrap; do not clip content. */
          @media(max-width:550px){
            #main .sources-page,#main .sources-page :is(div,section,article,header,details){min-width:0;max-width:100%;overflow-wrap:anywhere;}
            #main .sources-page .source-grid{grid-template-columns:minmax(0,1fr);}
            #main .sources-page table{width:100%;max-width:100%;table-layout:fixed;}
            #main .sources-page :is(th,td,pre,code){white-space:normal;overflow-wrap:anywhere;min-width:0;}
          }\n'''
              cssfiles[0].write_text(cssfiles[0].read_text()+correction)
              subprocess.run(['python','guide-first/build_guide.py'],check=True)
              subprocess.run(['python','guide-first/test_guide.py'],check=True)
          release=json.loads(Path('guide-first/dist/release.json').read_text())
          report=json.loads(Path('guide-first/test-evidence/browser-report.json').read_text())
          assert report['failed']==0 and not report['pageErrors']
          assert release['chapterCount']==16 and release['sectionCount']==84
          assert release['requiredExercises']==0 and release['chapterWidgets']==0
          print('READING_FIRST_RELEASE_READY',release['sha256'],report['passed'])
          PY
      - name: Preserve the tested source and release on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];branch='writelaw-guide-first-20260908'
          assert repo=='Writedotlaw/lawyer-prompt-studio-previews' and os.environ['GITHUB_REF_NAME']==branch
          def call(path,body=None,method=None):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=json.dumps(body).encode() if body is not None else None,headers=headers,method=method or ('POST' if body is not None else 'GET'))
              with urllib.request.urlopen(req,timeout=90) as response:return json.load(response)
          manifest=json.loads(Path('guide-first-transfer/manifest.json').read_text())
          files=[Path(x['file']) for x in manifest['sourceFiles']]
          files += [p for p in Path('guide-first/dist').rglob('*') if p.is_file()]
          release=json.loads(Path('guide-first/dist/release.json').read_text())
          assert hashlib.sha256(Path('guide-first/dist/index.html').read_bytes()).hexdigest()==release['sha256']
          current=call('/git/ref/heads/'+branch)['object']['sha']
          commit=call('/git/commits/'+current)
          entries=[]
          for path in files:
              blob=call('/git/blobs',{'content':base64.b64encode(path.read_bytes()).decode(),'encoding':'base64'})
              entries.append({'path':str(path),'mode':'100644','type':'blob','sha':blob['sha']})
          tree=call('/git/trees',{'base_tree':commit['tree']['sha'],'tree':entries})
          changed=call('/git/commits',{'message':'Preserve verified reading-first guide and source-coverage revision','tree':tree['sha'],'parents':[current]})
          call('/git/refs/heads/'+branch,{'sha':changed['sha'],'force':False},'PATCH')
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write('APPROVED_GUIDE_SHA='+release['sha256']+'\n')
          print('TESTED_SOURCE_COMMIT='+changed['sha'])
          PY
      - name: Prepare the established guarded publisher for this exact revision
        run: |
          python - <<'PY'
          from pathlib import Path
          old=Path('.github/writelaw-release/publish.py').read_text()
          replacements={
            "BRANCH='writelaw-public-edition-20260908'":"BRANCH='writelaw-guide-first-20260908'",
            "BASE_SHA='be11c3d012c00f81404f7374910b42d3d3a29ac1524037fa46d06076f608bb96'":"BASE_SHA='fff210bd1dfc317c2f80f493e0a30c6c72e55d8cec15c5468e1162776eafe16e'",
            "STATUS_PATH='.github/writelaw-release/status.json'":"STATUS_PATH='.github/guide-first-release/status.json'",
            "Path('public-edition/dist/index.html')":"Path('guide-first/dist/index.html')",
            "Path('public-edition/dist/vercel.json')":"Path('guide-first/dist/vercel.json')",
            "shutil.copyfile('.github/ai-guide-tests/check_public_site.py',check)":"shutil.copyfile('guide-first-release/live_checks.py',check)"
          }
          for source,target in replacements.items():
              assert source in old,'Guarded publisher changed: '+source
              old=old.replace(source,target)
          old=old.replace("'Write.law public edition'","'Write.law reading-first guide'")
          destination=Path('.github/guide-first-release/publish.py');destination.parent.mkdir(parents=True,exist_ok=True);destination.write_text(old)
          PY
          python -m py_compile .github/guide-first-release/publish.py guide-first-release/live_checks.py
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-audit --no-fund vercel@58.4.4
          echo "VERCEL_CLI=$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" >> "$GITHUB_ENV"
      - name: Request approval and publish only to the existing Vercel project and URL
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
          CI: 'true'
          NO_COLOR: '1'
          VERCEL_TELEMETRY_DISABLED: '1'
        run: python .github/guide-first-release/publish.py
      - name: Preserve actual source, build, and public verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reading-first-release-${{ github.run_id }}
          path: |
            guide-first/
            .github/guide-first-release/results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Remove temporary authorization files
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,shutil
          for folder in Path(os.environ['RUNNER_TEMP']).glob('writelaw-vercel-auth-*'):
              if folder.is_dir():shutil.rmtree(folder)
          PY
