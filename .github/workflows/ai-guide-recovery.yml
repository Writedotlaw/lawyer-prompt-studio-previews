name: AI guide deployment recovery
on:
  push:
    branches: [ai-guide-deployment-recovery-20260906]
    paths:
      - .github/workflows/ai-guide-recovery.yml
      - recovery/publish-ready.json
permissions:
  contents: write
concurrency:
  group: ai-guide-publication
  cancel-in-progress: false
jobs:
  prepare-import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the isolated recovery branch
        uses: actions/checkout@v4
      - name: Reconstruct and verify the approved guide
        run: python recovery/publish.py --verify-only
      - name: Publish only guide build files to the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/site/index.html recovery/site/vercel.json recovery/site/release.json
          git diff --cached --quiet || git commit -m 'Publish verified revised guide build for hosting'
          git push origin HEAD:ai-guide-deployment-recovery-20260906
          COMMIT=$(git rev-parse HEAD)
          echo "VERIFIED_BUILD_COMMIT=$COMMIT"
          echo "VERIFIED_HTML_URL=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$COMMIT/recovery/site/index.html"
          python - <<'PY'
          from pathlib import Path
          import json,os,subprocess
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          Path('recovery/results/source.json').write_text(json.dumps({
              'commit':sha,'htmlUrl':f'https://raw.githubusercontent.com/{os.environ["GITHUB_REPOSITORY"]}/{sha}/recovery/site/index.html',
              'indexSha256':'be11c3d012c00f81404f7374910b42d3d3a29ac1524037fa46d06076f608bb96'
          },indent=2))
          PY
      - name: Check whether this repository already has a deployment credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_DEPLOYMENT_CREDENTIAL_AVAILABLE=true'
          else
            echo 'VERCEL_DEPLOYMENT_CREDENTIAL_AVAILABLE=false'
          fi
      - name: Preserve verified source information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-guide-source-${{ github.run_id }}
          path: recovery/results/
          retention-days: 7
          if-no-files-found: warn
