name: AI guide deployment recovery
on:
  push:
    branches: [ai-guide-deployment-recovery-20260906]
    paths:
      - .github/workflows/ai-guide-recovery.yml
      - recovery/publish-ready.json
permissions:
  contents: read
concurrency:
  group: ai-guide-public-verification
  cancel-in-progress: false
jobs:
  verify-public-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated verification tools
        uses: actions/checkout@v4
      - name: Verify the actual public guide and preserve the existing gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,time,urllib.request,urllib.error
          expected='be11c3d012c00f81404f7374910b42d3d3a29ac1524037fa46d06076f608bb96'
          url='https://writedotlaw.github.io/lawyer-prompt-studio-previews/ai-guide-revised/'
          out=Path('recovery/results');out.mkdir(exist_ok=True)
          for attempt in range(90):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                content=r.read(2000000)
                digest=hashlib.sha256(content).hexdigest()
                if r.status==200 and digest==expected and r.url==url and 'text/html' in r.headers.get('Content-Type',''):
                  report={'previewUrl':url,'publicUrl':url,'host':'GitHub Pages','httpStatus':200,'servedBytes':len(content),'servedSha256':digest,'verifiedWithoutLogin':True,'status':'public-http-200-verified'}
                  print('PUBLIC_REVISED_GUIDE_VERIFIED='+json.dumps(report),flush=True)
                  (out/'deployment-result.json').write_text(json.dumps(report,indent=2))
                  break
                print(f'Waiting for approved revision, attempt {attempt+1}',flush=True)
            except (urllib.error.URLError,TimeoutError):
              print(f'Waiting for public build, attempt {attempt+1}',flush=True)
            time.sleep(5)
          else:
            raise RuntimeError('The public URL did not serve the exact revised guide within the verification window.')
          with urllib.request.urlopen('https://writedotlaw.github.io/lawyer-prompt-studio-previews/',timeout=20) as r:
            gallery=r.read()
            assert hashlib.sha256(gallery).hexdigest()=='de6303c5db736835e7be963f3334aa238e5f16512679ce86ade027187c07075d', 'Existing gallery changed; inspect before claiming completion.'
            print('EXISTING_GALLERY_UNCHANGED=true',flush=True)
          PY
      - name: Install browser test runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test actual public HTTPS site with fresh desktop and mobile browsers
        run: python recovery/check_public_site.py
      - name: Preserve public deployment evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-guide-live-verification-${{ github.run_id }}
          path: recovery/results/
          retention-days: 14
          if-no-files-found: warn
