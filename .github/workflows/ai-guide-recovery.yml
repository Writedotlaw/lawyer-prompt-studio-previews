name: AI guide deployment recovery
on:
  push:
    branches: [ai-guide-deployment-recovery-20260906]
    paths:
      - .github/workflows/ai-guide-recovery.yml
      - recovery/publish-ready.json
permissions:
  contents: read
concurrency:
  group: ai-guide-publication
  cancel-in-progress: false
jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out the isolated recovery branch
        uses: actions/checkout@v4
      - name: Verify and publish only the approved guide
        run: python recovery/publish.py
      - name: Install the browser test runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test the actual public HTTPS site on desktop and mobile
        run: python recovery/check_public_site.py
      - name: Preserve deployment evidence and encrypted management metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-guide-publication-${{ github.run_id }}
          path: recovery/results/
          retention-days: 7
          if-no-files-found: warn
