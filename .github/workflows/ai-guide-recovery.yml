name: AI guide deployment recovery
on:
  push:
    branches: [ai-guide-deployment-recovery-20260906]
    paths: [.github/workflows/ai-guide-recovery.yml, recovery/publish-ready.json]
permissions:
  contents: read
jobs:
  check-route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Vercel deployment service
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.error
          urls = [
              'https://raw.githubusercontent.com/vercel-labs/agent-skills/main/skills/deploy-to-vercel/resources/deploy-codex.sh',
              'https://codex-deploy-skills.vercel.sh/api/deploy',
          ]
          for url in urls:
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      print(url, 'HTTP', response.status)
              except urllib.error.HTTPError as error:
                  print(url, 'HTTP', error.code)
                  if error.code not in (405,):
                      raise
          print('ROUTE_CHECK_COMPLETE: No website was deployed by this diagnostic.')
          PY
