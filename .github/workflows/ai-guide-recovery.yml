name: AI guide deployment recovery
on:
  push:
    branches: [ai-guide-deployment-recovery-20260906]
    paths:
      - .github/workflows/ai-guide-recovery.yml
      - recovery/publish-ready.json
permissions:
  contents: read
  pages: read
jobs:
  inspect-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect existing Pages source and public hosts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib
          repo=os.environ['GITHUB_REPOSITORY']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/pages',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
            with urllib.request.urlopen(req,timeout=25) as r:
              data=json.load(r)
              print('EXISTING_PAGES='+json.dumps({k:data.get(k) for k in ['status','html_url','cname','source','build_type','public','https_enforced']}))
          except urllib.error.HTTPError as e:
            print('PAGES_METADATA_HTTP='+str(e.code))
            print(e.read().decode()[:500])
          for url in ['https://writedotlaw.github.io/lawyer-prompt-studio-previews/','https://regalia-ai-field-guide-joe-regalias-projects.vercel.app']:
            try:
              with urllib.request.urlopen(url,timeout=25) as r:
                b=r.read(2000000)
                print('PUBLIC_CHECK='+json.dumps({'url':url,'finalUrl':r.url,'status':r.status,'contentType':r.headers.get('Content-Type'),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'snippet':b[:250].decode('utf8',errors='replace')}))
            except urllib.error.HTTPError as e:
              print('PUBLIC_CHECK='+json.dumps({'url':url,'status':e.code,'finalUrl':e.url}))
          PY
