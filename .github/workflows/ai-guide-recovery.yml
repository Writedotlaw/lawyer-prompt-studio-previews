name: AI guide deployment recovery
on:
  push:
    branches: [ai-guide-deployment-recovery-20260906]
    paths: [.github/workflows/ai-guide-recovery.yml, recovery/publish-ready.json]
permissions:
  contents: write
jobs:
  check-route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the existing public guide
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          python - <<'PY'
          import urllib.request, urllib.error, hashlib, json, pathlib
          urls = [
            'https://regalia-ai-field-guide-joe-regalias-projects.vercel.app',
            'https://regalia-ai-field-guide-7vt5rq6hv-joe-regalias-projects.vercel.app',
          ]
          results=[]
          for i,url in enumerate(urls):
            try:
              with urllib.request.urlopen(url, timeout=30) as r:
                b=r.read()
                result={'url':url,'status':r.status,'finalUrl':r.url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'beginning':b[:600].decode('utf-8','replace')}
                if r.status==200 and len(b)>100000 and b'The AI-Enabled Lawyer' in b:
                  path=pathlib.Path('recovery')/('existing-live-'+str(i)+'.html')
                  path.write_bytes(b)
                  result['sourcePath']=str(path)
            except Exception as e:
              result={'url':url,'error':str(e)}
            results.append(result)
          pathlib.Path('recovery/live-probe.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - name: Record deployment diagnostics on the recovery branch
        run: |
          git config user.name 'Guide deployment'
          git config user.email '156871333+Writedotlaw@users.noreply.github.com'
          git add recovery/
          git diff --cached --quiet || (git commit -m 'Record existing public guide response' && git push origin HEAD:ai-guide-deployment-recovery-20260906)
