name: Review the reading-first Write.law guide
on:
  push:
    branches: [writelaw-guide-first-20260908]
    paths:
      - .github/workflows/build-guide-first.yml
      - guide-first/rebuild.json
permissions:
  contents: write
concurrency:
  group: writelaw-guide-first-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read the isolated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Recover and verify the authored source files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,json,lzma,tarfile
          root=Path('guide-first-transfer')
          manifest=json.loads((root/'manifest.json').read_text())
          parts=[]
          for item in manifest['chunks']:
              content=(root/item['file']).read_bytes()
              assert len(content)==item['bytes'],item['file']+' length mismatch'
              assert hashlib.sha256(content).hexdigest()==item['sha256'],item['file']+' digest mismatch'
              parts.append(content)
          payload=base64.b64decode(b''.join(parts),validate=True)
          assert hashlib.sha256(payload).hexdigest()==manifest['sha256'],'Source archive digest mismatch'
          allowed={x['file']:x['sha256'] for x in manifest['sourceFiles']}
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(payload)),mode='r:') as archive:
              members=archive.getmembers()
              assert len(members)==len(allowed) and {m.name for m in members}==set(allowed)
              for member in members:
                  assert member.isfile() and not member.issym() and not member.islnk()
                  content=archive.extractfile(member).read()
                  assert hashlib.sha256(content).hexdigest()==allowed[member.name]
                  destination=Path(member.name)
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  # After the first extraction, a reviewed source fix takes precedence.
                  if not destination.exists():destination.write_bytes(content)
          print('All six editorial source files verified; no live website has changed.')
          PY
      - name: Build the guide and check source compatibility
        run: |
          python -m pip install --disable-pip-version-check mistune==3.2.1 playwright==1.55.0
          python guide-first/build_guide.py
          python -m playwright install --with-deps chromium
      - name: Test the guide over real HTTP in desktop and mobile browsers
        run: python guide-first/test_guide.py
      - name: Stage the tested editable source and release on this branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];branch='writelaw-guide-first-20260908'
          def call(path,body=None,method=None):
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=json.dumps(body).encode() if body is not None else None,headers=headers,method=method or ('POST' if body is not None else 'GET'))
              with urllib.request.urlopen(req,timeout=90) as response:return json.load(response)
          current=call('/git/ref/heads/'+branch)['object']['sha']
          parent=call('/git/commits/'+current)
          files=[Path('guide-first')/name for name in ['sections.py','reference.py','reading-ui.js','reading.css','build_guide.py','test_guide.py','Source-Coverage.md','change-inventory.json','edited-data.json']]
          files+=list(Path('guide-first/dist').glob('*'))+list(Path('guide-first/editable-site').glob('*'))
          entries=[]
          for path in files:
              assert path.is_file() and path.suffix in ['.py','.js','.css','.html','.md','.json']
              blob=call('/git/blobs',{'content':base64.b64encode(path.read_bytes()).decode(),'encoding':'base64'})
              entries.append({'path':path.as_posix(),'mode':'100644','type':'blob','sha':blob['sha']})
          tree=call('/git/trees',{'base_tree':parent['tree']['sha'],'tree':entries})
          commit=call('/git/commits',{'message':'Stage tested reading-first guide and source coverage; not yet published','tree':tree['sha'],'parents':[current]})
          call('/git/refs/heads/'+branch,{'sha':commit['sha'],'force':False},'PATCH')
          print('TESTED_SOURCE_COMMIT='+commit['sha'])
          Path('guide-first/staged-build.json').write_text(json.dumps({'commit':commit['sha'],'branch':branch,'deployed':False},indent=2))
          PY
      - name: Summarize what was actually tested
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path('guide-first');root.mkdir(exist_ok=True)
          lines=['# Write.law reading-first review','', 'This workflow does not authenticate with Vercel or deploy a website.','']
          release=root/'dist/release.json';report=root/'test-evidence/browser-report.json'
          if release.exists():
              r=json.loads(release.read_text());lines += ['Build SHA-256: '+r['sha256'], 'Chapters: '+str(r['chapterCount'])+'; reading sections: '+str(r['sectionCount'])+'.','Reading words: '+str(r['readingWords'])+'.','']
          if report.exists():
              r=json.loads(report.read_text());lines += [str(r['passed'])+' browser checks passed; '+str(r['failed'])+' failed.','Routes: '+str(r['routeCount'])+'.','JavaScript errors: '+str(len(r['pageErrors']))+'.','']
              lines += ['FAIL: '+c['check']+' — '+c['detail'] for c in r['checks'] if not c['passed']]
          else:lines += ['Browser checks did not finish. Do not claim a successful test.']
          text='\n'.join(lines);(root/'REVIEW-STATUS.md').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text)
          print(text)
          PY
      - name: Preserve the guide, coverage review, and actual browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writelaw-guide-first-review-${{ github.run_id }}
          path: guide-first/
          retention-days: 14
          if-no-files-found: error
