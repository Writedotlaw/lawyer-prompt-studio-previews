name: Publish and verify revised AI guide
on:
  push:
    branches: [ai-guide-deployment-recovery-20260906]
    paths: [recovery/verified-release.json]
permissions:
  contents: read
concurrency:
  group: verified-regalia-ai-guide
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated recovery branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install publishing and browser-check dependencies
        run: python -m pip install --disable-pip-version-check requests cryptography playwright
      - name: Publish byte-verified revised guide
        run: python recovery/publish_verified.py
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Test the actual public deployment
        run: python recovery/verify_hosted.py
      - name: Save deployment record, encrypted ownership, and public-site test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-revised-guide-deployment
          path: recovery/verified-results/
          if-no-files-found: warn
          retention-days: 30
