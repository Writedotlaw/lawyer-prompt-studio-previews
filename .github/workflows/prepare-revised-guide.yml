name: Prepare revised AI guide for Vercel import
on:
  push:
    branches: [ai-guide-deployment-recovery-20260906]
    paths: [.github/workflows/prepare-revised-guide.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reconstruct, verify, and publish the single-file source
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,urllib.request
          repo='Writedotlaw/lawyer-prompt-studio-previews'
          branch='ai-guide-deployment-recovery-20260906'
          shas=['be0770d2feeb78f124ee73c0c00124309d75687f','7745f3b7ca02bb4c87a0f825876aa6e94d336313','5d31fca337d6fa0e0b3cfddeb81a859cbddb895e','2acbbc074c8265f6cd13f9149f921bb5b613e7a2','2e09d5978bbbeb6fb2a3b824d813596a69f4f018','d7c54b41a5376aad3d982646076f1fb2da3cb818','327516c64fb131f5cda561fa9e7ba07a67b25910','0674e899653a02480f552decd3ffc376ec6add0b','6e4b8cfb65804c517c9d8920ff2f9116c16a1b67','72d337250cff4e2a2c872cd83411eef4a49d871d']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'AI-guide-publication'}
          parts=[]
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response: blob=json.load(response)
              part=base64.b64decode(blob['content'])
              assert hashlib.sha1(('blob '+str(len(part))+'\0').encode()+part).hexdigest()==sha
              parts.append(part)
          html=lzma.decompress(base64.b64decode(b''.join(parts),validate=True))
          digest=hashlib.sha256(html).hexdigest()
          assert digest=='be11c3d012c00f81404f7374910b42d3d3a29ac1524037fa46d06076f608bb96'
          assert len(html)==376003
          api='https://api.github.com/repos/'+repo+'/contents/recovery/index.html'
          payload={'message':'Publish exact revised guide source for standalone deployment','branch':branch,'content':base64.b64encode(html).decode()}
          req=urllib.request.Request(api+'?ref='+branch,headers=headers)
          try:
              with urllib.request.urlopen(req,timeout=30) as response: payload['sha']=json.load(response)['sha']
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req,timeout=60) as response: result=json.load(response)
          print('Exact revised guide preserved. SHA256:',digest)
          print('Source URL: https://raw.githubusercontent.com/'+repo+'/'+branch+'/recovery/index.html')
          PY
